<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Synth Studio</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;width:100%;height:100dvh;background:#1a2030;color:#e8ecf4;font-family:system-ui,sans-serif;overflow:hidden;touch-action:none;user-select:none}
.app{display:grid;grid-template-rows:auto auto minmax(0,1fr) auto auto auto;grid-template-columns:minmax(0,1fr) 44px minmax(128px,168px);height:100%;height:100dvh;width:100%;max-width:1100px;margin:0 auto;overflow:hidden;background:#243044;border:2px solid #4a6080;border-radius:10px}
.topbar{grid-column:1/-1;grid-row:1;z-index:5;display:flex;flex-wrap:nowrap;gap:2px;align-items:center;padding:2px 4px;background:#2a3850;border-bottom:1px solid #4a6080;overflow-x:auto;scrollbar-width:none;min-width:0}
.topbar::-webkit-scrollbar{display:none}
h1{font-size:.62rem;color:#7ec8ff;white-space:nowrap;flex-shrink:0;font-weight:800}
.controls{display:flex;flex-wrap:nowrap;gap:2px;align-items:center;min-width:0}
label{font-size:.5rem;color:#a0b0c8;display:flex;align-items:center;gap:1px;white-space:nowrap;flex-shrink:0;font-weight:600}
select,button{background:#1e2838;color:#e0e8f0;border:1.5px solid #5a7a9a;border-radius:5px;padding:2px 5px;font-size:.55rem;cursor:pointer;flex-shrink:0;font-weight:700;min-height:22px}
button{background:#344860}
button:active{transform:scale(.95)}
button.on{background:#3a8fd0;border-color:#6ab8f0;color:#fff}
button.rec-on{background:#d04060;border-color:#f07090;color:#fff;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.7}}
.status{font-size:.48rem;color:#90a0b8;min-width:28px;flex-shrink:0}
/* FX: однакові довгі повзунки, 2 ряди */
.fxbar{grid-column:1;grid-row:2;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:2px 5px;padding:2px 4px;background:#1e2a3c;border-bottom:1px solid #4a6080;min-width:0;overflow:hidden}
.fx-group{display:flex;align-items:center;gap:3px;min-width:0;padding:1px 3px;background:#243048;border-radius:4px;border:1px solid #3a4a60}
.fx-group span{font-size:.42rem;color:#8aa0b8;white-space:nowrap;font-weight:700;flex-shrink:0;width:2.6em}
.fxbar input[type=range]{flex:1 1 auto;width:100%;min-width:0;height:12px;accent-color:#5ab0e0;padding:0}
input[type=number]{width:36px;background:#1e2838;color:#e0e8f0;border:1.5px solid #5a7a9a;border-radius:4px;padding:1px 2px;font-size:.52rem;min-height:20px}
.kb-wrap{grid-column:1;grid-row:3;display:flex;flex-direction:column;padding:2px;min-height:0;min-width:0;overflow:hidden;background:#1a2435}
.oct-lab{display:flex;justify-content:space-around;font-size:.42rem;color:#7090b0;padding-bottom:1px;flex-shrink:0;font-weight:700}
.keys{flex:1;display:flex;position:relative;min-height:0;touch-action:none}
.white-keys{display:flex;width:100%;height:100%;gap:0}
.key{flex:1;border-radius:0 0 5px 5px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:4px;font-size:.48rem;font-weight:700}
.white{background:linear-gradient(180deg,#f4f7fb,#d8e0ec);color:#2a4060;border:1.5px solid #3a5578;margin:0 1px;box-shadow:0 2px 0 #2a4060}
.white.active{background:linear-gradient(180deg,#6ad0a0,#3aa870)!important;border-color:#1a8050;color:#063;transform:translateY(1px);box-shadow:0 1px 0 #186040}
.black-keys{position:absolute;top:0;left:0;right:0;height:55%;pointer-events:none}
.black{position:absolute;height:100%;background:linear-gradient(180deg,#3a4558,#1e2838);color:#c0d0e0;border-radius:0 0 4px 4px;border:1.5px solid #0a1018;box-shadow:0 2px 0 #000;pointer-events:auto;z-index:2;font-size:.4rem;display:flex;align-items:flex-end;justify-content:center;padding-bottom:3px;font-weight:700}
.black.active{background:linear-gradient(180deg,#f0a040,#d07020)!important;border-color:#a05010;color:#fff;transform:translateY(1px);box-shadow:0 1px 0 #804010}
/* вертикальний pitch */
.pitch-col{grid-column:2;grid-row:3;display:flex;flex-direction:column;align-items:center;justify-content:stretch;padding:4px 2px;background:#1e2435;border-left:1px solid #3a4a60;min-height:0;gap:4px}
.pitch-col .plab{font-size:.42rem;color:#e0a040;font-weight:800}
.pitch-col #pitchVal{font-size:.5rem;color:#e0c080;font-weight:800}
.pitch-col input[type=range]#pitchBend{
  flex:1;width:28px;min-height:0;margin:0;
  writing-mode:vertical-lr;direction:rtl;
  -webkit-appearance:slider-vertical;appearance:slider-vertical;
  accent-color:#e0a040;cursor:pointer;
}
/* доріжки від верху; кнопки запису лишаються внизу колонки */
.side{grid-column:3;grid-row:2/4;background:#1e2e28;border-left:2px solid #3a6a50;display:flex;flex-direction:column;overflow:hidden;min-height:0;min-width:0;border-radius:0 8px 0 0}
.side-h{padding:2px 4px;font-size:.5rem;color:#70c090;border-bottom:1px solid #3a6a50;display:flex;justify-content:space-between;flex-shrink:0;font-weight:800}
.tracks-list{flex:1 1 auto;overflow-y:auto;padding:2px;min-height:0}
.track{background:#243830;border:1px solid #4a8a60;border-radius:4px;padding:1px 3px;margin-bottom:1px;font-size:.42rem;line-height:1.15}
.track.muted{opacity:.4}
.track-row{display:flex;align-items:center;gap:2px;min-width:0}
.track-name{flex:0 1 auto;max-width:42%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#a0d8b0;font-weight:700}
.track button{padding:1px 3px;font-size:.42rem;min-width:16px;min-height:16px;flex-shrink:0}
.track-vol{flex:1 1 auto;width:auto;min-width:0;height:10px;accent-color:#50c080}
/* один рядок коротких кнопок над проєктами */
.side-act{padding:2px;display:flex;flex-wrap:nowrap;gap:2px;border-top:1px solid #3a6a50;flex-shrink:0}
.side-act button{flex:1 1 0;min-width:0;font-size:1.05rem;padding:1px 0;min-height:30px;line-height:1;white-space:nowrap}
.proj-box{padding:2px 3px 4px;border-top:1px solid #3a6a50;flex-shrink:0;background:#243528}
.proj-box .proj-controls{display:flex;flex-wrap:nowrap;gap:2px;align-items:center}
.proj-box select{width:32px;font-size:.55rem;font-weight:700;min-height:30px;padding:1px}
.proj-box button{flex:1;min-width:24px;font-size:1.05rem;padding:1px 0;min-height:30px;line-height:1}
.drums-row{grid-column:1/-1;display:grid;grid-template-columns:repeat(8,1fr);gap:2px;padding:3px 4px;background:#2a2438;border-top:1px solid #5a4a70;flex-shrink:0}
.drum{background:#3a3450;border:1.5px solid #6a5a90;border-radius:7px;padding:4px 1px;text-align:center;font-size:.48rem;font-weight:800;color:#c8b8e8;cursor:pointer;min-height:28px;display:flex;align-items:center;justify-content:center}
.drum:active,.drum.hit{background:#8060c0;border-color:#b090e0;color:#fff;transform:scale(.95)}
.loops-row{grid-column:1/-1;display:flex;flex-wrap:nowrap;gap:2px;padding:3px 4px;background:#1e2830;border-top:1px solid #3a5a50;overflow-x:auto;overflow-y:visible;scrollbar-width:none;flex-shrink:0;min-width:0;position:relative;z-index:200}
.loops-row::-webkit-scrollbar{display:none}
.loop-btn{flex-shrink:0;background:#2a3a38;border:1.5px solid #4a8a70;border-radius:7px;padding:4px 8px;font-size:.48rem;color:#90d0b0;cursor:pointer;white-space:nowrap;font-weight:700;min-height:26px;position:relative}
.loop-btn.on{background:#2a9060;border-color:#50d090;color:#fff}
.loop-wrap{position:relative;flex-shrink:0;display:inline-flex;flex-direction:column;z-index:201}
.loop-menu{display:none;position:fixed;z-index:10000;background:#1a2a28;border:1.5px solid #4a8a70;border-radius:8px;padding:4px;min-width:120px;box-shadow:0 8px 24px rgba(0,0,0,.6)}
.loop-menu.open{display:block}
.loop-menu button{display:block;width:100%;text-align:left;background:#243830;border:1px solid #3a6a50;border-radius:5px;padding:4px 6px;margin:2px 0;font-size:.48rem;color:#b0e0c0;cursor:pointer;font-weight:700}
.loop-menu button:active,.loop-menu button.on{background:#2a9060;color:#fff}
.metro-on{background:#3a8fd0!important;border-color:#6ab8f0!important;color:#fff!important}
footer{grid-column:1/-1;padding:2px 6px;font-size:.42rem;color:#7080a0;display:flex;justify-content:space-between;background:#1a2030;border-top:1px solid #3a4a60;flex-shrink:0;min-width:0;gap:4px;border-radius:0 0 8px 8px}
footer span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rotate-hint{display:none;position:fixed;inset:0;background:#1a2030;z-index:999;flex-direction:column;align-items:center;justify-content:center;gap:10px;font-size:1.1rem;color:#7ec8ff;font-weight:800}
@media (orientation:portrait) and (max-width:600px){.rotate-hint{display:flex}.app{display:none}}
@media (max-height:420px){.drum{min-height:20px;font-size:.42rem}.side-act button{padding:3px 1px;min-height:22px}}
</style>
</head>
<body>
<div class="rotate-hint"><div style="font-size:2rem">🔄</div><div>Поверни в альбомний режим</div></div>
<div class="app">
  <div class="topbar">
    <h1>🎹</h1>
    <div class="controls">
      <label>Тмб<select id="timbre">
        <option value="triangle">Triangle</option><option value="sine">Sine</option>
        <option value="sawtooth">Saw</option><option value="square">Square</option>
        <option value="fm">FM</option><option value="organ">Organ</option>
        <option value="pluck">Pluck</option><option value="pad">Pad</option>
        <option value="bass">Bass</option>
      </select></label>
      <label>Окт<select id="baseOctave">
        <option value="2">C2–C4</option><option value="3" selected>C3–C5</option><option value="4">C4–C6</option>
      </select></label>
      <button id="micBtn">🎙 Мік</button>
      <button id="sustainBtn">Суст</button>
      <button id="arpBtn">Арп</button>
      <label>Арп<select id="arpPattern">
        <option value="up">↑</option><option value="down">↓</option>
        <option value="updown">↕</option><option value="random">🎲</option><option value="chord">▣</option>
      </select></label>
      <label>мс <input type="number" id="arpRate" min="40" max="500" value="150" step="5" style="width:38px"></label>
      <label>Такт<select id="arpBars">
        <option value="2">2</option><option value="3">3</option><option value="4" selected>4</option>
        <option value="5">5</option><option value="6">6</option><option value="7">7</option><option value="8">8</option>
      </select></label>
      <button id="metroBtn" title="Метроном">⏱</button>
      <label>BPM <input type="number" id="metroBpm" min="40" max="240" value="120" step="1" style="width:40px"></label>
      <button id="midiBtn">MIDI</button>
      <span class="status" id="status">Готово</span>
    </div>
  </div>
  <div class="fxbar">
    <div class="fx-group"><span>Гучн</span><input type="range" id="masterVol" min="0" max="150" value="110" title="Гучність"></div>
    <div class="fx-group"><span>Фільтр</span><input type="range" id="filterFreq" min="200" max="8000" value="5000" title="Фільтр"></div><div class="fx-group"><span>Резон</span><input type="range" id="filterQ" min="0" max="20" value="2" title="Резонанс"></div>
    <div class="fx-group"><span>Ехо%</span><input type="range" id="delayMix" min="0" max="100" value="15" title="Ехо"></div><div class="fx-group"><span>Ехомс</span><input type="range" id="delayTime" min="50" max="600" value="250" title="Затримка"></div>
    <div class="fx-group"><span>Реверб</span><input type="range" id="reverbMix" min="0" max="100" value="10" title="Реверб"></div>
    <div class="fx-group"><span>Хорус</span><input type="range" id="chorusMix" min="0" max="100" value="0" title="Хорус"></div>
    <div class="fx-group"><span>Дистор</span><input type="range" id="distMix" min="0" max="100" value="0" title="Дистор"></div>
  </div>
  <div class="kb-wrap">
    <div class="oct-lab" id="octaveLabels"></div>
    <div class="keys" id="keyboard"></div>
  </div>
  <div class="pitch-col">
    <span class="plab">Тон</span>
    <input type="range" id="pitchBend" min="-12" max="12" value="0" step="1" title="Тон">
    <span id="pitchVal">0</span>
  </div>
  <div class="side">
    <div class="side-h"><span>Доріжки</span><span id="trackCount">0</span></div>
    <div class="tracks-list" id="tracksList"></div>
    <div class="side-act">
      <button id="recTrackBtn" title="Запис">●</button>
      <button id="playAllBtn" title="Грати">▶</button>
      <button id="stopAllBtn" title="Стоп">■</button>
      <button id="exportBtn" title="Opus">💾</button>
      <button id="clearTracksBtn" title="Очистити">🗑</button>
    </div>
    <div class="proj-box">
      <div class="proj-controls">
        <select id="projSlot" title="Слот 1–10">
          <option value="1">1</option><option value="2">2</option><option value="3">3</option>
          <option value="4">4</option><option value="5">5</option><option value="6">6</option>
          <option value="7">7</option><option value="8">8</option><option value="9">9</option>
          <option value="10">10</option>
        </select>
        <button id="saveProjBtn" title="Зберегти">💾</button>
        <button id="loadProjBtn" title="Відкрити">📂</button>
        <button id="delProjBtn" title="Видалити">✕</button>
      </div>
      <div id="projInfo" hidden></div>
    </div>
  </div>
  <div class="drums-row" id="drums"></div>
  <div class="loops-row" id="loops"></div>
  <footer><span>10 проєктів · Суст · що чуєш — те пишеться</span><span id="midiInfo">MIDI: —</span></footer>
</div>

function makeDistCurve(amount){
  const n=256, curve=new Float32Array(n);
  if(amount<1){for(let i=0;i<n;i++)curve[i]=(i*2)/n-1;return curve;}
  const k=amount;
  for(let i=0;i<n;i++){const x=(i*2)/n-1;curve[i]=((Math.PI+k)*x)/(Math.PI+k*Math.abs(x));}
  return curve;
}
function makeReverbIR(){
  const sr=audioCtx.sampleRate, len=Math.floor(sr*1.6);
  const buf=audioCtx.createBuffer(2,len,sr);
  for(let ch=0;ch<2;ch++){
    const d=buf.getChannelData(ch);
    for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/len, 2.2);
  }
  return buf;
}
function ensureAudio(){
  if(audioCtx){if(audioCtx.state==='suspended')audioCtx.resume();return;}
  audioCtx=new(window.AudioContext||window.webkitAudioContext)();
  masterGain=audioCtx.createGain();masterGain.gain.value=1.1;masterGain.connect(audioCtx.destination);

  // liveMix = всё, что слышишь от «живых» источников (после FX).
  // Запись берёт ТОЛЬКО liveMix → что слышишь, то и пишется.
  // Готовые дорожки идут в masterGain мимо liveMix.
  liveMix=audioCtx.createGain();liveMix.gain.value=1;
  liveMix.connect(masterGain);
  recordDest=audioCtx.createMediaStreamDestination();
  liveMix.connect(recordDest);

  // input → dist → filter → dry ─┬→ liveMix
  //                               ├→ delay → wet → liveMix
  //                               ├→ chorus → wet → liveMix
  //                               └→ reverb → wet → liveMix
  distNode=audioCtx.createWaveShaper();
  distNode.curve=makeDistCurve(0);
  distNode.oversample='2x';

  filterNode=audioCtx.createBiquadFilter();
  filterNode.type='lowpass';filterNode.frequency.value=5000;filterNode.Q.value=2;

  dryGain=audioCtx.createGain();dryGain.gain.value=0.9;

  delayNode=audioCtx.createDelay(1);delayNode.delayTime.value=0.25;
  delayFb=audioCtx.createGain();delayFb.gain.value=0.35;
  delayWet=audioCtx.createGain();delayWet.gain.value=0.15;
  delayNode.connect(delayFb);delayFb.connect(delayNode);delayNode.connect(delayWet);

  chorusDelay=audioCtx.createDelay(0.05);chorusDelay.delayTime.value=0.012;
  chorusLFO=audioCtx.createOscillator();chorusLFO.type='sine';chorusLFO.frequency.value=1.4;
  chorusGain=audioCtx.createGain();chorusGain.gain.value=0.004;
  chorusWet=audioCtx.createGain();chorusWet.gain.value=0;
  chorusLFO.connect(chorusGain);chorusGain.connect(chorusDelay.delayTime);
  chorusLFO.start();
  chorusDelay.connect(chorusWet);

  reverbNode=audioCtx.createConvolver();reverbNode.buffer=makeReverbIR();
  reverbWet=audioCtx.createGain();reverbWet.gain.value=0.1;

  distNode.connect(filterNode);
  filterNode.connect(dryGain);
  dryGain.connect(delayNode);
  dryGain.connect(chorusDelay);
  dryGain.connect(reverbNode);
  reverbNode.connect(reverbWet);

  dryGain.connect(liveMix);
  delayWet.connect(liveMix);
  chorusWet.connect(liveMix);
  reverbWet.connect(liveMix);

  // drums + loops → тот же FX-chain → liveMix
  drumGain=audioCtx.createGain();drumGain.gain.value=0.85;
  drumGain.connect(distNode);

  micGain=audioCtx.createGain();micGain.gain.value=0;
  micGain.connect(distNode);

  // метроном → тільки masterGain (НЕ в liveMix/запис)
  metroGain=audioCtx.createGain();metroGain.gain.value=0.35;
  metroGain.connect(masterGain);
  if(typeof metroOn!=='undefined' && metroOn) startMetroTimer();
}
function liveOut(){
  // голоса синтезатора → FX → liveMix (и в колонки, и в запись)
  const g=audioCtx.createGain();
  g.connect(distNode);
  return g;
}
function freqFromMidi(m){return 440*Math.pow(2,(m-69+pitchSemis)/12);}
function noteLabel(m){return NOTE_NAMES[m%12]+(Math.floor(m/12)-1);}
function speak(t){

/* Voices — ALWAYS hold until stopNote(). No auto-decay. All octaves. */
function createVoice(midi,now){
  const freq=Math.max(20, Math.min(12000, freqFromMidi(midi)));
  const gain=liveOut(), oscs=[], peak=0.25;
  let stopFn=null;

  // Attack, then stay at level forever until releaseAt is called
  function attackHold(atk, level){
    gain.gain.cancelScheduledValues(now);
    gain.gain.setValueAtTime(0.0001, now);
    gain.gain.linearRampToValueAtTime(level, now+Math.max(atk,0.008));
    // жёстко держим уровень — без автозатухания
    gain.gain.setValueAtTime(level, now+Math.max(atk,0.008)+0.001);
  }
  function releaseAt(t, relSec){
    try{
      gain.gain.cancelScheduledValues(t);
      const cur=Math.max(gain.gain.value, 0.001);
      gain.gain.setValueAtTime(cur, t);
      gain.gain.linearRampToValueAtTime(0, t+relSec);
    }catch(e){}
    oscs.forEach(o=>{ try{ o.stop(t+relSec+0.1); }catch(e){} });
  }

  if(['sine','triangle','sawtooth','square'].includes(timbre)){
    const o=audioCtx.createOscillator(); o.type=timbre; o.frequency.setValueAtTime(freq, now);
    o.connect(gain); o.start(now); oscs.push(o);
    attackHold(0.01, peak);
    stopFn=t=>releaseAt(t, 0.2);
  } else if(timbre==='fm'){
    const car=audioCtx.createOscillator(), mod=audioCtx.createOscillator(), mg=audioCtx.createGain();
    car.type='sine'; mod.type='sine';
    car.frequency.setValueAtTime(freq, now);
    mod.frequency.setValueAtTime(freq*3.5, now);
    mg.gain.value=Math.min(freq*1.8, 4000);
    mod.connect(mg); mg.connect(car.frequency); car.connect(gain);
    car.start(now); mod.start(now); oscs.push(car, mod);
    attackHold(0.01, peak*0.8);
    stopFn=t=>releaseAt(t, 0.2);
  } else if(timbre==='organ'){
    [1,2,3,4].forEach((m,i)=>{
      const o=audioCtx.createOscillator(); o.type='sine'; o.frequency.setValueAtTime(freq*m, now);
      const g=audioCtx.createGain(); g.gain.value=[0.35,0.22,0.12,0.08][i];
      o.connect(g); g.connect(gain); o.start(now); oscs.push(o);
    });
    attackHold(0.02, peak*0.55);
    stopFn=t=>releaseAt(t, 0.25);
  } else if(timbre==='pluck'){
    const o=audioCtx.createOscillator(); o.type='sawtooth'; o.frequency.setValueAtTime(freq, now);
    const f=audioCtx.createBiquadFilter(); f.type='lowpass'; f.Q.value=1.5;
    f.frequency.setValueAtTime(Math.min(Math.max(freq*6, 300), 12000), now);
    o.connect(f); f.connect(gain); o.start(now); oscs.push(o);
    attackHold(0.005, peak);
    stopFn=t=>releaseAt(t, 0.25);
  } else if(timbre==='pad'){
    [0, 0.03, -0.03].forEach(d=>{
      const o=audioCtx.createOscillator(); o.type='sawtooth'; o.frequency.setValueAtTime(freq, now); o.detune.value=d*100;
      const f=audioCtx.createBiquadFilter(); f.type='lowpass'; f.frequency.value=1600;
      o.connect(f); f.connect(gain); o.start(now); oscs.push(o);
    });
    attackHold(0.3, peak*0.4);
    stopFn=t=>releaseAt(t, 0.5);
  } else if(timbre==='bass'){
    const o=audioCtx.createOscillator(); o.type='sawtooth'; o.frequency.setValueAtTime(freq, now);
    const f=audioCtx.createBiquadFilter(); f.type='lowpass'; f.Q.value=3;
    f.frequency.setValueAtTime(Math.min(Math.max(freq*4, 100), 6000), now);
    o.connect(f); f.connect(gain); o.start(now); oscs.push(o);
    attackHold(0.008, peak);
    stopFn=t=>releaseAt(t, 0.2);
  } else {
    const o=audioCtx.createOscillator(); o.type='triangle'; o.frequency.setValueAtTime(freq, now);
    o.connect(gain); o.start(now); oscs.push(o);
    attackHold(0.01, peak);
    stopFn=t=>releaseAt(t, 0.2);
  }
  return {oscs, gain, stopFn};
}
function playNote(midi,keyEl){
  ensureAudio();
  // Sus: повторный тап снимает ноту. Уже звучащую без Sus не перезапускаем.
  if(activeNotes.has(midi)){
    if(sustain){
      stopNote(midi, true);
    }
    return;
  }
  if(arpOn){
    if(!arpHeld.includes(midi)){arpHeld.push(midi);arpHeld.sort((a,b)=>a-b);}
    const el=keyEl||document.querySelector('.key[data-midi="'+midi+'"]');
    if(el) el.classList.add('active');
    statusEl.textContent=noteLabel(midi);
    if(!arpTimer) startArp();
    return;
  }
  const now=audioCtx.currentTime;
  const v=createVoice(midi, now);
  const el=keyEl||document.querySelector('.key[data-midi="'+midi+'"]');
  activeNotes.set(midi,{stopFn:v.stopFn, gain:v.gain, oscs:v.oscs, keyEl:el||null});
  if(el) el.classList.add('active');
  statusEl.textContent=noteLabel(midi);
}
function stopNote(midi, force){
  if(arpOn){
    arpHeld=arpHeld.filter(n=>n!==midi);
    document.querySelectorAll('.key[data-midi="'+midi+'"]').forEach(el=>el.classList.remove('active'));
    if(!arpHeld.length) stopArp();
    return;
  }
  if(sustain && !force) return;
  const e=activeNotes.get(midi);
  if(e){
    if(e.stopFn) e.stopFn(audioCtx.currentTime);
    activeNotes.delete(midi);
    if(e.keyEl) e.keyEl.classList.remove('active');
  }
  document.querySelectorAll('.key[data-midi="'+midi+'"]').forEach(el=>el.classList.remove('active'));
}
function stopAllNotes(){
  const now=audioCtx?audioCtx.currentTime:0;
  for(const mid of [...activeNotes.keys()]){
    const e=activeNotes.get(mid);
    if(e&&e.stopFn) e.stopFn(now);
  }
  activeNotes.clear();
  arpHeld=[];
  stopArp();
  document.querySelectorAll('.key.active').forEach(k=>k.classList.remove('active'));
}
function startArp(){if(arpTimer)return;arpIndex=0;arpDir=1;arpStep();}
function stopArp(){if(arpTimer){clearTimeout(arpTimer);arpTimer=null;}for(const m of[...activeNotes.keys()]){const e=activeNotes.get(m);if(e?.stopFn)e.stopFn(audioCtx.currentTime);}activeNotes.clear();}
function arpStep(){
  if(!arpOn||!arpHeld.length){stopArp();return;}
  ensureAudio();
  const now=audioCtx.currentTime;
  for(const m of[...activeNotes.keys()]){const e=activeNotes.get(m);if(e?.stopFn)e.stopFn(now);}
  activeNotes.clear();
  // довжина циклу залежить від кількості тактів (2–8)
  const cycleLen=Math.max(1, arpHeld.length * Math.max(1, Math.min(8, arpBars)));
  let notes=[];
  if(arpPattern==='chord'){
    notes=[...arpHeld];
  } else {
    let idx;
    if(arpPattern==='up'){ idx=arpIndex%arpHeld.length; arpIndex=(arpIndex+1)%cycleLen; }
    else if(arpPattern==='down'){ idx=arpHeld.length-1-(arpIndex%arpHeld.length); arpIndex=(arpIndex+1)%cycleLen; }
    else if(arpPattern==='updown'){
      if(arpHeld.length===1) idx=0;
      else {
        idx=Math.min(Math.max(arpIndex,0), arpHeld.length-1);
        arpIndex+=arpDir;
        if(arpIndex>=arpHeld.length-1) arpDir=-1;
        if(arpIndex<=0) arpDir=1;
      }
    } else {
      idx=Math.floor(Math.random()*arpHeld.length);
    }
    notes=[arpHeld[idx]];
  }
  notes.forEach(midi=>{
    const v=createVoice(midi,now);
    const gate=Math.min(arpRateMs/1000*0.8,0.3);
    v.gain.gain.cancelScheduledValues(now);
    v.gain.gain.setValueAtTime(0.0001,now);
    v.gain.gain.exponentialRampToValueAtTime(0.2,now+0.008);
    v.gain.gain.exponentialRampToValueAtTime(0.0001,now+gate);
    activeNotes.set(midi,v);
    statusEl.textContent=noteLabel(midi);
  });
  arpTimer=setTimeout(arpStep, arpRateMs);
}

/* Metronome — тільки masterGain, незалежний від drums/loops */
let metroBeat=0;
function ensureMetroGain(){
  if(!audioCtx) return;
  if(!metroGain){
    metroGain=audioCtx.createGain();
    metroGain.gain.value=0.35;
    metroGain.connect(masterGain);
  }
}
function clickMetro(accent){
  if(!audioCtx) return;
  ensureMetroGain();
  if(!metroGain) return;
  const now=audioCtx.currentTime;
  const o=audioCtx.createOscillator();
  const g=audioCtx.createGain();
  o.type='sine';
  o.frequency.value=accent?1200:900;
  g.gain.setValueAtTime(0.0001, now);
  g.gain.exponentialRampToValueAtTime(accent?0.28:0.14, now+0.005);
  g.gain.exponentialRampToValueAtTime(0.0001, now+0.06);
  o.connect(g); g.connect(metroGain);
  o.start(now); o.stop(now+0.08);
}
function stopMetroTimer(){
  if(metroTimer){ clearInterval(metroTimer); metroTimer=null; }
}
function startMetroTimer(){
  stopMetroTimer();
  const ms=60000/Math.max(40, Math.min(240, metroBpm||120));
  metroTimer=setInterval(function(){
    if(!metroOn){ stopMetroTimer(); return; }
    if(audioCtx && audioCtx.state==='suspended') audioCtx.resume();
    clickMetro(metroBeat%4===0);
    metroBeat++;
  }, ms);
}
function toggleMetro(){
  ensureAudio();
  ensureMetroGain();
  metroOn=!metroOn;
  const btn=document.getElementById('metroBtn');
  if(metroOn){
    btn.classList.add('metro-on');
    metroBeat=0;
    startMetroTimer();
  } else {
    btn.classList.remove('metro-on');
    stopMetroTimer();
  }
}

/* Generate loop buffers */
function generateLoopBuffer(style, variant){
  ensureAudio();
  const sr=audioCtx.sampleRate;
  const steps=16*style.bars;
  const stepDur=60/style.bpm/4;
  const totalDur=stepDur*steps;
  const len=Math.floor(totalDur*sr);
  const buf=audioCtx.createBuffer(1,len,sr);
  const data=buf.getChannelData(0);
  const patSrc=(variant&&variant.pat)||style.pat||(style.variants&&style.variants[0]&&style.variants[0].pat)||{};
  const map={K:'kick',S:'snare',H:'hat',O:'ohat',C:'clap',T:'tom',R:'rim',P:'perc'};
  // Render simple one-shots into buffer offline-ish by mixing samples
  function hit(type,atSec,vel){
    const at=Math.floor(atSec*sr);
    if(type==='kick'){for(let i=0;i<Math.min(sr*0.35,len-at);i++){const t=i/sr;const env=Math.exp(-t*8);const f=150*Math.exp(-t*20)+40;data[at+i]+=vel*env*Math.sin(2*Math.PI*f*t)*0.9;}}
    else if(type==='snare'){for(let i=0;i<Math.min(sr*0.15,len-at);i++){const t=i/sr;const env=Math.exp(-t*14);data[at+i]+=vel*env*((Math.random()*2-1)*0.18+Math.sin(2*Math.PI*180*t)*0.12);}}
    else if(type==='hat'){for(let i=0;i<Math.min(sr*0.04,len-at);i++){const t=i/sr;data[at+i]+=vel*Math.exp(-t*55)*(Math.random()*2-1)*0.08;}}
    else if(type==='ohat'){for(let i=0;i<Math.min(sr*0.25,len-at);i++){const t=i/sr;data[at+i]+=vel*Math.exp(-t*10)*(Math.random()*2-1)*0.07;}}
    else if(type==='clap'){for(let i=0;i<Math.min(sr*0.15,len-at);i++){const t=i/sr;data[at+i]+=vel*Math.exp(-t*14)*(Math.random()*2-1)*0.18;}}
    else if(type==='tom'){for(let i=0;i<Math.min(sr*0.28,len-at);i++){const t=i/sr;const f=200*Math.exp(-t*8)+70;data[at+i]+=vel*Math.exp(-t*7)*Math.sin(2*Math.PI*f*t)*0.6;}}
    else if(type==='rim'){for(let i=0;i<Math.min(sr*0.04,len-at);i++){const t=i/sr;data[at+i]+=vel*Math.exp(-t*50)*Math.sin(2*Math.PI*800*t)*0.35;}}
    else if(type==='perc'){for(let i=0;i<Math.min(sr*0.14,len-at);i++){const t=i/sr;const f=550*Math.exp(-t*10)+150;data[at+i]+=vel*Math.exp(-t*12)*Math.sin(2*Math.PI*f*t)*0.3;}}
  }
  Object.keys(patSrc).forEach(k=>{
    const pat=patSrc[k];const type=map[k];if(!type)return;
    for(let i=0;i<Math.min(pat.length,steps);i++){if(pat[i]==='x')hit(type,i*stepDur,0.85+Math.random()*0.15);}
  });
  // soft clip + tame highs
  for(let i=0;i<len;i++){
    let x=data[i]*0.7;
    data[i]=Math.max(-0.85,Math.min(0.85, x));
  }
  return buf;
}

/* Запись liveMix (post-FX) через ScriptProcessor — стабильно, с эффектами */
function startLiveRec(){
  recChunks=[]; recLength=0;
  const bs=2048;
  try{
    recProc=audioCtx.createScriptProcessor(bs,1,1);
  }catch(e){
    statusEl.textContent='Rec n/a';
    return false;
  }
  recProc.onaudioprocess=function(e){
    if(!isRec) return;
    const input=e.inputBuffer.getChannelData(0);
    recChunks.push(new Float32Array(input));
    recLength+=input.length;
  };
  liveMix.connect(recProc);
  recSilent=audioCtx.createGain();
  recSilent.gain.value=0;
  recProc.connect(recSilent);
  recSilent.connect(audioCtx.destination);
  return true;
}
function stopLiveRec(){
  isRec=false;
  if(recProc){
    try{liveMix.disconnect(recProc);}catch(e){}
    try{recProc.disconnect();}catch(e){}
    recProc.onaudioprocess=null;
    recProc=null;
  }
  if(recSilent){
    try{recSilent.disconnect();}catch(e){}
    recSilent=null;
  }
  if(recLength<512){
    statusEl.textContent='Слишком коротко';
    recChunks=[]; recLength=0;
    return;
  }
  const sr=audioCtx.sampleRate;
  let buf=audioCtx.createBuffer(1,recLength,sr);
  const data=buf.getChannelData(0);
  let off=0;
  for(let i=0;i<recChunks.length;i++){
    data.set(recChunks[i],off);
    off+=recChunks[i].length;
  }
  recChunks=[]; recLength=0;
  // выровнять по длине 1-й дорожки
  if(tracks.length&&tracks[0].buffer){
    const target=tracks[0].buffer.length;
    if(buf.length!==target){
      const aligned=audioCtx.createBuffer(1,target,sr);
      const n=Math.min(buf.length,target);
      aligned.getChannelData(0).set(buf.getChannelData(0).subarray(0,n));
      buf=aligned;
    }
  }
  addTrack(buf, micEnabled?'Live+Mic':'Live');
  statusEl.textContent='Трек + (с FX)';
}

function playAllTracks(silent){

async function exportMix(){
  if(!tracks.length){statusEl.textContent='Немає доріжок';return;}
  ensureAudio();statusEl.textContent='Стиснення…';
  const maxDur=Math.max(...tracks.filter(t=>t.buffer).map(t=>t.buffer.duration),0.1);
  // offline mix
  const off=new OfflineAudioContext(2,Math.ceil(maxDur*audioCtx.sampleRate),audioCtx.sampleRate);
  tracks.forEach(t=>{
    if(!t.buffer||t.muted)return;
    const s=off.createBufferSource();s.buffer=t.buffer;
    const g=off.createGain();g.gain.value=t.gainValue;
    s.connect(g);g.connect(off.destination);s.start(0);
  });
  const ren=await off.startRendering();
  // сжатый Opus/WebM через MediaRecorder (намного меньше WAV, качество высокое)
  try{
    const msDest=audioCtx.createMediaStreamDestination();
    const src=audioCtx.createBufferSource();src.buffer=ren;
    const mute=audioCtx.createGain();mute.gain.value=0;
    src.connect(msDest);src.connect(mute);mute.connect(audioCtx.destination);
    let mime='audio/webm;codecs=opus';
    if(!MediaRecorder.isTypeSupported(mime)) mime='audio/webm';
    const chunks=[];
    const mr=new MediaRecorder(msDest.stream,{mimeType:mime,audioBitsPerSecond:160000});
    mr.ondataavailable=e=>{if(e.data.size>0)chunks.push(e.data);};
    const done=new Promise(res=>{mr.onstop=()=>res();});
    mr.start(100);
    src.start();
    src.onended=()=>{setTimeout(()=>{try{mr.stop();}catch(e){}},80);};
    // safety timeout
    setTimeout(()=>{try{if(mr.state!=='inactive')mr.stop();}catch(e){}}, (maxDur+1)*1000);
    await done;
    const blob=new Blob(chunks,{type:mime});
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download='mix-'+Date.now()+'.webm';
    a.click();
    URL.revokeObjectURL(a.href);
    statusEl.textContent='Opus ✓ ('+Math.round(blob.size/1024)+' КБ)';
  }catch(err){
    // fallback: mono 22kHz WAV (меньше стерео 48k)
    const monoLen=Math.floor(ren.duration*22050);
    const mono=audioCtx.createBuffer(1,monoLen,22050);
    const out=mono.getChannelData(0);
    const L=ren.getChannelData(0), R=ren.numberOfChannels>1?ren.getChannelData(1):L;
    for(let i=0;i<monoLen;i++){
      const srcIdx=Math.min(ren.length-1, Math.floor(i*ren.sampleRate/22050));
      out[i]=(L[srcIdx]+R[srcIdx])*0.5;
    }
    const wav=bufToWav(mono);
    const blob=new Blob([wav],{type:'audio/wav'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='mix-'+Date.now()+'.wav';a.click();
    statusEl.textContent='WAV 22k ✓';
  }
}
function bufToWav(buffer){
  const nCh=buffer.numberOfChannels,sr=buffer.sampleRate,ab=new ArrayBuffer(44+buffer.length*nCh*2),v=new DataView(ab);
  const ws=(o,s)=>{for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i));};
  ws(0,'RIFF');v.setUint32(4,36+buffer.length*nCh*2,true);ws(8,'WAVE');ws(12,'fmt ');
  v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,nCh,true);v.setUint32(24,sr,true);
  v.setUint32(28,sr*nCh*2,true);v.setUint16(32,nCh*2,true);v.setUint16(34,16,true);ws(36,'data');v.setUint32(40,buffer.length*nCh*2,true);
  let o=44;for(let i=0;i<buffer.length;i++)for(let c=0;c<nCh;c++){const s=Math.max(-1,Math.min(1,buffer.getChannelData(c)[i]));v.setInt16(o,s<0?s*0x8000:s*0x7FFF,true);o+=2;}
  return ab;
}

const PROJ_DB='SynthStudioDB', PROJ_STORE='projects', PROJ_META='meta';
let currentSlot=1;
function openProjDB(){
  return new Promise((resolve,reject)=>{
    const req=indexedDB.open(PROJ_DB,2);
    req.onupgradeneeded=()=>{
      const db=req.result;
      if(!db.objectStoreNames.contains(PROJ_STORE)) db.createObjectStore(PROJ_STORE);
    };
    req.onsuccess=()=>resolve(req.result);
    req.onerror=()=>reject(req.error);
  });
}
function slotKey(n){ return 'slot-'+n; }
async function idbSaveProject(project, slot){
  const db=await openProjDB();
  const key=slotKey(slot||currentSlot);
  return new Promise((resolve,reject)=>{
    const tx=db.transaction(PROJ_STORE,'readwrite');
    tx.objectStore(PROJ_STORE).put(project, key);
    tx.oncomplete=()=>resolve();
    tx.onerror=()=>reject(tx.error);
  });
}
async function idbLoadProject(slot){

    req.onerror=()=>reject(req.error);
  });
}
async function idbDeleteProject(slot){

async function idbListFilledSlots(){

function arrayBufferToBase64(buf){
  const bytes=new Uint8Array(buf);
  let s=''; const chunk=0x8000;
  for(let i=0;i<bytes.length;i+=chunk) s+=String.fromCharCode.apply(null, bytes.subarray(i, Math.min(i+chunk, bytes.length)));
  return btoa(s);
}
function base64ToArrayBuffer(b64){
  const s=atob(b64); const bytes=new Uint8Array(s.length);
  for(let i=0;i<s.length;i++) bytes[i]=s.charCodeAt(i);
  return bytes.buffer;
}

  set('masterVol',fx.masterVol); set('filterFreq',fx.filterFreq); set('filterQ',fx.filterQ);

function buildProjectData(){
  const trackData=[];
  for(const t of tracks){
    if(!t.buffer) continue;
    trackData.push({name:t.name, gainValue:t.gainValue, muted:!!t.muted, wav:arrayBufferToBase64(bufToWav(t.buffer))});
  }
  return {
    v:1, type:'synth-studio-project', savedAt:new Date().toISOString(),
    settings:{timbre, baseOctave, sustain, arpOn, arpPattern, arpRateMs, fx:getFxSettings()},
    nextId, tracks:trackData
  };

async function applyProjectData(project){
  if(!project||project.type!=='synth-studio-project') return false;
  ensureAudio();
  // повне очищення — жоден буфер/стан іншого слоту не лишається
  stopPlayAll(); stopAllNotes(); stopAllLoops();
  tracks = [];
  nextId = 1;
  renderTracks();
  const s=project.settings||{};
  if(s.timbre){ timbre=s.timbre; const el=document.getElementById('timbre'); if(el) el.value=timbre; }
  if(s.baseOctave!=null){ baseOctave=+s.baseOctave; const el=document.getElementById('baseOctave'); if(el) el.value=String(baseOctave); buildKeyboard(); }
  if(s.arpPattern){ arpPattern=s.arpPattern; const el=document.getElementById('arpPattern'); if(el) el.value=arpPattern; }
  if(s.arpRateMs!=null){ arpRateMs=+s.arpRateMs; const el=document.getElementById('arpRate'); if(el) el.value=arpRateMs; }
  if(typeof s.sustain==='boolean'){ sustain=s.sustain; document.getElementById('sustainBtn').classList.toggle('on',sustain); }
  if(typeof s.arpOn==='boolean'){ arpOn=s.arpOn; document.getElementById('arpBtn').classList.toggle('on',arpOn); }
  applyFxSettings(s.fx);
  nextId = Math.max(1, project.nextId||1);
  const loaded=[];
  for(const td of (project.tracks||[])){
    if(!td||!td.wav) continue;
    try{
      const ab=base64ToArrayBuffer(td.wav);
      const buf=await audioCtx.decodeAudioData(ab.slice(0));
      const id=nextId++;
      loaded.push({
        id:id,
        name:td.name||('T'+id),
        buffer:buf,
        gainValue: td.gainValue!=null ? +td.gainValue : 0.85,
        muted: !!td.muted
      });
    }catch(err){ console.warn('track decode fail', err); }
  }
  tracks = loaded;
  renderTracks();
  return true;
}

      clearWorkspace();
      statusEl.textContent='Слот '+slot+' порожній';
      await refreshProjUI();
      return;
    }
    const ok=await applyProjectData(project);
    await refreshProjUI();
    statusEl.textContent=ok?('Слот '+slot+': '+tracks.length+' дор.'):'Помилка даних';
  }catch(e){ statusEl.textContent='Помилка завантаження'; alert('Не вдалося завантажити: '+(e.message||e)); }
}
async function deleteProjectSlot(){
  const slot=+(document.getElementById('projSlot')||{}).value||currentSlot;
  if(!confirm('Видалити проєкт у слоті '+slot+'?\nІнші слоти не зміняться.')) return;
  try{
    await idbDeleteProject(slot);
    if(slot===currentSlot) clearWorkspace();
    await refreshProjUI();
    statusEl.textContent='Слот '+slot+' видалено';
  }catch(e){ alert('Не вдалося видалити'); }
}
async function autoLoadProject(){
  try{
    await refreshProjUI();
    const project=await idbLoadProject(currentSlot);
    if(!project) return;
    ensureAudio();
    await applyProjectData(project);
    statusEl.textContent='Слот '+currentSlot+' ('+tracks.length+')';
  }catch(e){}
}


/* Mic — простой запрос, как раньше: сразу getUserMedia({audio:true}) */
async function toggleMic(){
  ensureAudio();
  const mb=document.getElementById('micBtn');
  if(!micEnabled){
    try{
      if(audioCtx.state==='suspended') await audioCtx.resume();
      // простой запрос — максимальная совместимость с телефонами
      if(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia){
        micStream=await navigator.mediaDevices.getUserMedia({audio:true});
      } else {
        const legacy=navigator.getUserMedia||navigator.webkitGetUserMedia||navigator.mozGetUserMedia;
        if(!legacy){ alert('Браузер не підтримує мікрофон'); return; }
        micStream=await new Promise((resolve,reject)=>legacy.call(navigator,{audio:true},resolve,reject));
      }
      micSource=audioCtx.createMediaStreamSource(micStream);
      micSource.connect(micGain);
      micGain.gain.value=0.9;
      micEnabled=true;
      mb.classList.add('on'); mb.textContent='🎙 УВІМ';
      statusEl.textContent='Мік УВІМ';
    }catch(e){
      const name=(e&&e.name)||'Error';
      statusEl.textContent='Mic: '+name;
      if(name==='NotAllowedError'||name==='PermissionDeniedError'){
        alert('Дозволь мікрофон у вікні браузера і натисни 🎙 Мік ще раз.');
      } else {
        alert('Мікрофон: '+name+'\n'+(e&&e.message?e.message:''));
      }
    }
  } else {
    micGain.gain.value=0;
    if(micStream) micStream.getTracks().forEach(t=>t.stop());
    micStream=null; micSource=null; micEnabled=false;
    mb.classList.remove('on'); mb.textContent='🎙 Мік';
    statusEl.textContent='Мік ВИМ';
  }
}

/* Keyboard */
function buildKeyboard(){
  keyboard.innerHTML='';document.getElementById('octaveLabels').innerHTML='';
  const wDiv=document.createElement('div');wDiv.className='white-keys';
  const bDiv=document.createElement('div');bDiv.className='black-keys';
  // MIDI C of octave N = (N+1)*12 → C2=36, C3=48, C4=60. 2 octaves = +24 semitones.
  const startMidi=(baseOctave+1)*12;
  const totalW=15;
  for(let o=0;o<2;o++){const s=document.createElement('span');s.textContent='О.'+(baseOctave+o);document.getElementById('octaveLabels').appendChild(s);}
  const last=document.createElement('span');last.textContent='C'+(baseOctave+2);document.getElementById('octaveLabels').appendChild(last);
  for(let i=0;i<totalW;i++){
    const oct=Math.floor(i/7),wi=i%7,isLast=i===totalW-1;
    const midi=isLast?(startMidi+24):(startMidi+oct*12+WHITE_NOTES[wi]);
    const key=document.createElement('div');key.className='key white';key.dataset.midi=String(midi);key.textContent=noteLabel(midi);wDiv.appendChild(key);
    if(!isLast&&[0,1,3,4,5].includes(wi)){
      const bo={0:1,1:3,3:6,4:8,5:10}[wi];const bm=startMidi+oct*12+bo;
      const black=document.createElement('div');black.className='key black';black.dataset.midi=String(bm);black.textContent=noteLabel(bm);
      const ww=100/totalW;black.style.left=((i+0.68)*ww-ww*0.55)+'%';black.style.width=(ww*1.15)+'%';bDiv.appendChild(black);
    }
  }
  keyboard.appendChild(wDiv);keyboard.appendChild(bDiv);


  // Надёжный multi-touch: слушатели НА каждой клавише (pointerId)
  const heldByPointer = new Map(); // pointerId -> midi

  function bindKey(key){
    const midi = +key.dataset.midi;
    key.style.touchAction = 'none';
    function hilite(m, on){
      document.querySelectorAll('.key[data-midi="'+m+'"]').forEach(el=>{
        if(on) el.classList.add('active'); else el.classList.remove('active');
      });
    }
    key.addEventListener('pointerdown', function(e){
      e.preventDefault(); e.stopPropagation();
      ensureAudio();
      try{ key.setPointerCapture(e.pointerId); }catch(err){}
      if(heldByPointer.has(e.pointerId)){
        const prev=heldByPointer.get(e.pointerId);
        if(prev!==midi && !sustain){ stopNote(prev,true); hilite(prev,false); }
      }
      heldByPointer.set(e.pointerId, midi);
      playNote(midi, key);
      hilite(midi, true);
    });
    function releasePtr(e){
      const m = heldByPointer.has(e.pointerId) ? heldByPointer.get(e.pointerId) : midi;
      heldByPointer.delete(e.pointerId);
      if(!sustain){ stopNote(m,true); hilite(m,false); }
    }
    key.addEventListener('pointerup', function(e){ e.preventDefault(); releasePtr(e); });
    key.addEventListener('pointercancel', releasePtr);
    key.addEventListener('lostpointercapture', releasePtr);
    key.addEventListener('pointermove', function(e){
      if(!heldByPointer.has(e.pointerId)) return;
      const stack=document.elementsFromPoint(e.clientX,e.clientY);
      let over=null;
      for(let i=0;i<stack.length;i++){
        if(stack[i].classList&&stack[i].classList.contains('key')&&stack[i].dataset.midi){ over=stack[i]; break; }
      }
      if(!over) return;
      const nm=+over.dataset.midi;
      const prev=heldByPointer.get(e.pointerId);
      if(nm===prev) return;
      if(!sustain){ stopNote(prev,true); hilite(prev,false); }
      heldByPointer.set(e.pointerId, nm);
      playNote(nm, over);
      hilite(nm, true);
    });
  }

  keyboard.querySelectorAll('.key').forEach(bindKey);
  // блокируем scroll/zoom на клавиатуре
  keyboard.addEventListener('touchstart', function(e){ e.preventDefault(); }, {passive:false});

}

/* MIDI — USB Type-C / OTG на телефоне */
function onMIDI(ev){
  ensureAudio();
  const d=ev.data; if(!d||d.length<2) return;
  const st=d[0], note=d[1], vel=d.length>2?d[2]:0;
  const cmd=st&0xf0;
  if(cmd===0x90 && vel>0){
    const keyEl=document.querySelector('.key[data-midi="'+note+'"]');
    playNote(note, keyEl);
  } else if(cmd===0x80 || (cmd===0x90 && vel===0)){
    if(!sustain) stopNote(note, true);
  } else if(cmd===0xB0 && note===64){
    sustain = vel>=64;
    document.getElementById('sustainBtn').classList.toggle('on', sustain);
    if(!sustain) stopAllNotes();
  }
}
function hookMidiInputs(){
  if(!midiAccess) return;
  const names=[];
  midiAccess.inputs.forEach(input=>{
    input.onmidimessage = onMIDI;
    names.push(input.name||'MIDI');
  });
  const info=document.getElementById('midiInfo');
  const btn=document.getElementById('midiBtn');
  if(names.length){
    info.textContent='MIDI: '+names.join(', ');
    btn.classList.add('on');
    statusEl.textContent='MIDI OK';
  } else {
    info.textContent='MIDI: чекаємо клавіатуру…';
    btn.classList.remove('on');
  }
}
async function initMIDI(){
  if(!navigator.requestMIDIAccess){
    document.getElementById('midiInfo').textContent='MIDI: не підтримується';
    alert('Web MIDI не поддерживается в этом браузере.\n\nAndroid: открой в Chrome, кабель Type-C OTG.\niPhone: Web MIDI почти недоступен.');
    return;
  }
  try{
    midiAccess = await navigator.requestMIDIAccess({ sysex: false });
    hookMidiInputs();
    midiAccess.onstatechange = function(e){
      hookMidiInputs();
      const p=e.port;
      if(p && p.type==='input'){
        statusEl.textContent = (p.state==='connected' ? 'MIDI + ' : 'MIDI − ') + (p.name||'');
      }
    };
  } catch(err){
    document.getElementById('midiInfo').textContent='MIDI: немає доступу';
    alert('Нет доступа к MIDI.\nAndroid: Chrome + OTG Type-C кабель.');
  }
}

document.getElementById('chorusMix').addEventListener('input',e=>{if(chorusWet)chorusWet.gain.setTargetAtTime(e.target.value/100,audioCtx.currentTime,0.02);});

document.getElementById('pitchBend').addEventListener('input',function(e){
  pitchSemis=+e.target.value;
  const lab=document.getElementById('pitchVal');
  if(lab) lab.textContent=(pitchSemis>0?'+':'')+pitchSemis;
  if(!audioCtx) return;
  const now=audioCtx.currentTime;
  for(const [midi, entry] of activeNotes){
    if(!entry||!entry.oscs) continue;
    const base=440*Math.pow(2,(midi-69+pitchSemis)/12);
    entry.oscs.forEach((o,i)=>{
      try{
        const mult=(timbre==='organ')?([1,2,3,4][i]||1):1;
        if(o.frequency) o.frequency.setTargetAtTime(base*mult, now, 0.03);
      }catch(err){}
    });
  }
});

document.getElementById('projSlot').addEventListener('change',async function(){
  const newSlot=+this.value;
  const prev=currentSlot;
  ensureAudio();
  try{
    // автозбереження попереднього слоту, щоб зміни не «перетекли» в інший
    if(prev>=1&&prev<=10){
      const snap=buildProjectData();
      snap.slot=prev;
      await idbSaveProject(snap, prev);
    }
  }catch(e){}
  currentSlot=newSlot;
  try{
    const project=await idbLoadProject(newSlot);
    if(project) await applyProjectData(project);
    else clearWorkspace();
  }catch(e){ clearWorkspace(); }
  await refreshProjUI();
  statusEl.textContent='Слот '+newSlot+(tracks.length?(' · '+tracks.length+' дор.'):'');
});

async function tryFullscreenLandscape(){
  try{
    const el=document.documentElement;
    if(!document.fullscreenElement && el.requestFullscreen){
      await el.requestFullscreen({navigationUI:'hide'}).catch(()=>el.requestFullscreen());
    }
    if(screen.orientation&&screen.orientation.lock){
      try{ await screen.orientation.lock('landscape'); }catch(e){}
    }
  }catch(e){}
}
window.addEventListener('orientationchange',()=>{
  if(window.matchMedia('(orientation: landscape)').matches) tryFullscreenLandscape();
});

try{autoLoadProject();}catch(e){}
document.body.addEventListener('pointerdown',()=>{
  ensureAudio();
  tryFullscreenLandscape();
  if(!midiAccess&&navigator.requestMIDIAccess)initMIDI();
},{once:true});
if(window.speechSynthesis){speechSynthesis.getVoices();speechSynthesis.onvoiceschanged=()=>speechSynthesis.getVoices();}
})();
