<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="screen-orientation" content="landscape">
<title>Synth Studio</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;width:100%;height:100dvh;background:#160a18;color:#f5e8f4;font-family:system-ui,sans-serif;overflow:hidden;touch-action:none;user-select:none}
.app{display:grid;grid-template-rows:auto auto minmax(0,1fr) auto auto auto;grid-template-columns:minmax(0,1fr) minmax(110px,150px);height:100%;height:100dvh;width:100%;max-width:1100px;margin:0 auto;overflow:hidden}
.topbar{grid-column:1/-1;display:flex;flex-wrap:nowrap;gap:3px;align-items:center;padding:2px 5px;background:linear-gradient(180deg,#2a1430,#160a18);border-bottom:1px solid:#4a2a50;overflow-x:auto;scrollbar-width:none;min-width:0}
.topbar::-webkit-scrollbar{display:none}
h1{font-size:.7rem;color:#d0a0c8;white-space:nowrap;flex-shrink:0}
.controls{display:flex;flex-wrap:nowrap;gap:3px;align-items:center;min-width:0}
label{font-size:.55rem;color:#a08098;display:flex;align-items:center;gap:2px;white-space:nowrap;flex-shrink:0}
select,button{background:#2a1834;color:#f0e0f0;border:1px solid:#5a3a60;border-radius:5px;padding:2px 5px;font-size:.62rem;cursor:pointer;flex-shrink:0}
button{background:#321c3c;transition:.1s}
button:active{transform:scale(.95)}
button.on{background:#7a4090;border-color:#c080d0;color:#fff}
button.rec-on{background:#a03070;border-color:#e070b0;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.65}}
.status{font-size:.55rem;color:#a08098;min-width:40px;flex-shrink:0}
.fxbar{grid-column:1/-1;display:flex;flex-wrap:nowrap;gap:4px;align-items:center;padding:2px 5px;background:#1c1024;border-bottom:1px solid:#3a2848;overflow-x:auto;scrollbar-width:none;min-width:0}
.fxbar::-webkit-scrollbar{display:none}
.fx-group{display:flex;align-items:center;gap:2px;padding:0 4px;border-right:1px solid:#3a2848;flex-shrink:0}
.fx-group span{font-size:.5rem;color:#a08098;white-space:nowrap}
input[type=range]{width:48px;height:11px;accent-color:#c070c0;padding:0}
input[type=number]{width:48px;background:#2a1834;color:#f0e0f0;border:1px solid #5a3a60;border-radius:4px;padding:2px 3px;font-size:.62rem}
.kb-wrap{grid-column:1;grid-row:3;display:flex;flex-direction:column;padding:2px 3px;min-height:0;min-width:0;overflow:hidden}
.oct-lab{display:flex;justify-content:space-around;font-size:.45rem;color:#705870;padding-bottom:1px;flex-shrink:0}
.keys{flex:1;display:flex;position:relative;min-height:0;touch-action:none}
.white-keys{display:flex;width:100%;height:100%}
.key{flex:1;border-radius:0 0 5px 5px;border:1px solid:#1a1020;display:flex;align-items:flex-end;justify-content:center;padding-bottom:4px;font-size:.5rem;font-weight:500}
.white{background:linear-gradient(180deg,#f8f0f8,#e0d0e8);color:#402050;box-shadow:0 2px 0 #b0a0b8}
.white.active{background:linear-gradient(180deg,#e0c0e8,#c0a0d0);transform:translateY(1px)}
.black-keys{position:absolute;top:0;left:0;right:0;height:54%;pointer-events:none}
.black{position:absolute;height:100%;background:linear-gradient(180deg,#3a2848,#1a1020);color:#c0a8c0;border-radius:0 0 3px 3px;box-shadow:0 2px 0 #100810;pointer-events:auto;z-index:2;font-size:.42rem;display:flex;align-items:flex-end;justify-content:center;padding-bottom:3px}
.black.active{background:linear-gradient(180deg,#8a50a0,#5a3080);transform:translateY(1px)}
.side{grid-column:2;grid-row:3;background:#1c1024;border-left:1px solid:#3a2848;display:flex;flex-direction:column;overflow:hidden;min-height:0;min-width:0}
.side-h{padding:2px 4px;font-size:.58rem;color:#b090b0;border-bottom:1px solid:#3a2848;display:flex;justify-content:space-between;flex-shrink:0}
.tracks-list{flex:1;overflow-y:auto;padding:2px;min-height:0}
.track{background:#241830;border:1px solid #4a3050;border-radius:4px;padding:2px 3px;margin-bottom:2px;font-size:.5rem}
.track.muted{opacity:.4}
.track-row{display:flex;align-items:center;gap:2px}
.track-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#d0b0d0}
.track button{padding:1px 3px;font-size:.48rem;min-width:16px}
.track-vol{width:36px;height:8px}
.side-act{padding:2px;display:flex;flex-wrap:wrap;gap:2px;border-top:1px solid #3a2848;flex-shrink:0}
.side-act button{flex:1;min-width:40px;font-size:.5rem;padding:3px 2px}
.drums-row{grid-column:1/-1;display:grid;grid-template-columns:repeat(8,1fr);gap:2px;padding:2px 4px;background:#1c1024;border-top:1px solid #3a2848;flex-shrink:0}
.drum{background:linear-gradient(180deg,#3a2848,#241830);border:1.5px solid #5a3a60;border-radius:5px;padding:3px 1px;text-align:center;font-size:.5rem;font-weight:600;color:#c0a0c0;cursor:pointer;min-height:28px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.drum:active,.drum.hit{background:linear-gradient(180deg,#a060b0,#703090);border-color:#e0b0e0;color:#fff;transform:scale(.95)}
.loops-row{grid-column:1/-1;display:flex;flex-wrap:nowrap;gap:2px;padding:2px 4px;background:#160a18;border-top:1px solid #3a2848;overflow-x:auto;scrollbar-width:none;flex-shrink:0;min-width:0}
.loops-row::-webkit-scrollbar{display:none}
.loop-btn{flex-shrink:0;background:#2a1834;border:1.5px solid #5a3a60;border-radius:5px;padding:3px 6px;font-size:.5rem;color:#c0a0c0;cursor:pointer;white-space:nowrap}
.loop-btn.on{background:#7a4090;border-color:#d0a0e0;color:#fff}
.loop-btn:active{transform:scale(.96)}
footer{grid-column:1/-1;padding:1px 6px;font-size:.45rem;color:#705870;display:flex;justify-content:space-between;background:#100810;flex-shrink:0;min-width:0;gap:4px}
footer span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* Портрет → сразу «альбом» за счёт CSS-поворота всего UI (без экрана «поверни») */
.rotate-hint{display:none!important}
@media (orientation:portrait){
  html,body{width:100%;height:100%;overflow:hidden;position:fixed;inset:0}
  .app{
    display:grid!important;
    position:fixed;
    top:0;left:0;
    width:100dvh;height:100dvw;
    max-width:none;
    margin:0;
    transform:rotate(90deg) translateY(-100%);
    transform-origin:top left;
    overflow:hidden;
  }
}
@media (orientation:landscape){
  .app{display:grid;transform:none;width:100%;height:100%;height:100dvh;max-width:1100px;margin:0 auto;position:relative}
}
@media (max-height:420px){.drum{min-height:22px;padding:1px;font-size:.45rem}.side-act button{padding:2px 1px}}
</style>
</head>
<body>
<div class="rotate-hint"><div class="icon">📱</div><div style="font-size:1.2rem;color:#e0b0e0">Поверни телефон</div><div>Нужен <b>альбомный</b> режим</div><div style="font-size:.85rem;color:#a08098;margin-top:8px">Поверни устройство набок</div></div>
<div class="app">
  <div class="topbar">
    <h1>🎹 Synth Studio</h1>
    <div class="controls">
      <label>Тембр<select id="timbre">
        <option value="triangle">Triangle</option><option value="sine">Sine</option>
        <option value="sawtooth">Saw</option><option value="square">Square</option>
        <option value="fm">FM</option><option value="organ">Organ</option>
        <option value="pluck">Pluck</option><option value="pad">Pad</option>
        <option value="bass">Bass</option>
      </select></label>
      <label>Окт<select id="baseOctave">
        <option value="2">C2–C4</option><option value="3" selected>C3–C5</option><option value="4">C4–C6</option>
      </select></label>
      <button id="micBtn">🎙 Mic</button>
      <button id="sustainBtn">Sus</button>
      <button id="arpBtn">Arp</button>
      <label>Arp<select id="arpPattern">
        <option value="up">↑</option><option value="down">↓</option>
        <option value="updown">↕</option><option value="random">🎲</option><option value="chord">▣</option>
      </select></label>
      <label>Rate мс <input type="number" id="arpRate" min="40" max="500" value="150" step="5" style="width:52px;background:#2a1834;color:#f0e0f0;border:1px solid #5a3a60;border-radius:4px;padding:2px 4px"></label>
      <button id="midiBtn">MIDI</button>
      <span class="status" id="status">Ready</span>
    </div>
  </div>
  <div class="fxbar">
    <div class="fx-group"><span>Громкость</span><input type="range" id="masterVol" min="0" max="150" value="110" title="Общая громкость"></div>
    <div class="fx-group"><span>Фильтр</span><input type="range" id="filterFreq" min="200" max="8000" value="5000" title="Частота среза фильтра"><span>Резонанс</span><input type="range" id="filterQ" min="0" max="20" value="2" title="Резонанс фильтра"></div>
    <div class="fx-group"><span>Эхо %</span><input type="range" id="delayMix" min="0" max="100" value="15" title="Громкость эха (delay)"><span>Эхо мс</span><input type="range" id="delayTime" min="50" max="600" value="250" title="Задержка эха в мс"></div>
    <div class="fx-group"><span>Реверб</span><input type="range" id="reverbMix" min="0" max="100" value="10" title="Объём пространства"></div>
    <div class="fx-group"><span>Хорус</span><input type="range" id="chorusMix" min="0" max="100" value="0" title="Хорус / расстройка"></div>
    <div class="fx-group"><span>Дисторшн</span><input type="range" id="distMix" min="0" max="100" value="0" title="Искажение звука"></div>
  </div>
  <div class="kb-wrap">
    <div class="oct-lab" id="octaveLabels"></div>
    <div class="keys" id="keyboard"></div>
  </div>
  <div class="side">
    <div class="side-h"><span>Дорожки</span><span id="trackCount">0</span></div>
    <div class="tracks-list" id="tracksList"></div>
    <div class="side-act">
      <button id="recTrackBtn">● Запись</button>
      <button id="playAllBtn">▶</button>
      <button id="stopAllBtn">■</button>
      <button id="exportBtn">💾 Opus</button>
      <button id="saveProjBtn" title="Сохранить в программе">💾 Сохранить</button>
      <button id="loadProjBtn" title="Открыть сохранённый проект">📂 Открыть</button>
      <button id="clearTracksBtn">🗑</button>
    </div>
  </div>
  <div class="drums-row" id="drums"></div>
  <div class="loops-row" id="loops"></div>
  <footer><span>Что слышишь — то пишется · FX в дорожках · Opus-экспорт</span><span id="midiInfo">MIDI: —</span></footer>
</div>
<script>
(function(){
const NOTE_NAMES=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const WHITE_NOTES=[0,2,4,5,7,9,11];
const DRUM_DEFS=[
  {id:'kick',n:'Kick'},{id:'snare',n:'Snare'},{id:'hat',n:'Hat'},{id:'ohat',n:'OHat'},
  {id:'clap',n:'Clap'},{id:'tom',n:'Tom'},{id:'rim',n:'Rim'},{id:'perc',n:'Perc'}
];
/* style, bpm, pattern as 16th notes: K=kick S=snare H=hat O=ohat C=clap T=tom R=rim P=perc */
const LOOP_STYLES=[
  {name:'House',bpm:124,bars:1,pat:{K:'x...x...x...x...',S:'....x.......x...',H:'x.x.x.x.x.x.x.x.'}},
  {name:'Techno',bpm:130,bars:1,pat:{K:'x...x...x...x...',S:'....x.......x...',H:'xxxxxxxxxxxxxxxx'}},
  {name:'Hip-Hop',bpm:90,bars:1,pat:{K:'x.....x.x.......',S:'....x.......x...',H:'..x...x...x...x.'}},
  {name:'Trap',bpm:140,bars:1,pat:{K:'x.....x.........',S:'....x..x....x..x',H:'x.x.x.xxx.x.x.xx'}},
  {name:'Rock',bpm:110,bars:1,pat:{K:'x...x...x...x...',S:'....x.......x...',H:'x.x.x.x.x.x.x.x.'}},
  {name:'Funk',bpm:100,bars:1,pat:{K:'x.....x...x.....',S:'....x......xx...',H:'x.x.x.x.x.x.x.x.'}},
  {name:'DnB',bpm:174,bars:1,pat:{K:'x.....x.x...x...',S:'....x.......x...',H:'xxxxxxxxxxxxxxxx'}},
  {name:'Garage',bpm:130,bars:1,pat:{K:'x...x..x.x......',S:'....x.......x...',H:'x.x.x.x.x.x.x.x.'}},
  {name:'Latin',bpm:100,bars:1,pat:{K:'x...x...x.x.x...',S:'....x...x...x...',H:'..x...x...x...x.',R:'x.x.x.x.x.x.x.x.'}},
  {name:'Reggaeton',bpm:95,bars:1,pat:{K:'x...x...x...x...',S:'....x.x.....x.x.',H:'................',C:'....x.x.....x.x.'}},
  {name:'Breakbeat',bpm:135,bars:1,pat:{K:'x.....x...x.....',S:'....x...x..xx...',H:'x.x.x.x.x.x.x.x.'}},
  {name:'Ambient',bpm:80,bars:2,pat:{K:'x...............',S:'........x.......',H:'....x.......x...',P:'..x...........x.'}},
  {name:'Jazz',bpm:120,bars:1,pat:{K:'x.......x...x...',S:'....x.......x...',H:'x.x.x.x.x.x.x.x.',R:'..............x.'}},
  {name:'Dubstep',bpm:140,bars:1,pat:{K:'x.......x.......',S:'....x.......x...',H:'x...x...x...x...',O:'..............x.'}},
  {name:'Afrobeat',bpm:110,bars:1,pat:{K:'x...x.x.x...x.x.',S:'....x.......x...',H:'x.x.x.x.x.x.x.x.',T:'..x...........x.'}},
  {name:'BoomBap',bpm:88,bars:1,pat:{K:'x......x.x......',S:'....x.......x...',H:'..x...x...x...x.'}},
  {name:'Trance',bpm:138,bars:1,pat:{K:'x...x...x...x...',S:'....x.......x...',H:'x.x.x.x.x.x.x.x.',O:'..............xx'}},
  {name:'Lo-Fi',bpm:85,bars:1,pat:{K:'x.....x.x.......',S:'....x.......x...',H:'..x...x...x...x.',P:'........x.......'}},
];

let audioCtx,masterGain,liveMix,filterNode,delayNode,delayFb,delayWet,dryGain;
let distNode,chorusDelay,chorusLFO,chorusGain,chorusWet,reverbNode,reverbWet;
let recordDest,micStream,micSource,micGain,micEnabled=false,drumGain;
let speechOn=false,sustain=false,arpOn=false,arpPattern='up',arpRateMs=150,arpTimer=null;
let arpHeld=[],arpIndex=0,arpDir=1;
let activeNotes=new Map(),baseOctave=3,timbre='triangle';
let tracks=[],nextId=1,isRec=false,playSrcs=[];
let recChunks=[],recLength=0,recProc=null,recSilent=null;
let loopPlayers={}; // name -> {buffer, playing, src, gain, style}
let midiAccess=null;

const statusEl=document.getElementById('status');
const tracksList=document.getElementById('tracksList');
const trackCountEl=document.getElementById('trackCount');
const keyboard=document.getElementById('keyboard');

function makeDistCurve(amount){
  const n=256, curve=new Float32Array(n);
  if(amount<1){for(let i=0;i<n;i++)curve[i]=(i*2)/n-1;return curve;}
  const k=amount;
  for(let i=0;i<n;i++){const x=(i*2)/n-1;curve[i]=((Math.PI+k)*x)/(Math.PI+k*Math.abs(x));}
  return curve;
}
function makeReverbIR(){
  const sr=audioCtx.sampleRate, len=Math.floor(sr*1.6);
  const buf=audioCtx.createBuffer(2,len,sr);
  for(let ch=0;ch<2;ch++){
    const d=buf.getChannelData(ch);
    for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/len, 2.2);
  }
  return buf;
}
function ensureAudio(){
  if(audioCtx){if(audioCtx.state==='suspended')audioCtx.resume();return;}
  audioCtx=new(window.AudioContext||window.webkitAudioContext)();
  masterGain=audioCtx.createGain();masterGain.gain.value=1.1;masterGain.connect(audioCtx.destination);

  // liveMix = всё, что слышишь от «живых» источников (после FX).
  // Запись берёт ТОЛЬКО liveMix → что слышишь, то и пишется.
  // Готовые дорожки идут в masterGain мимо liveMix.
  liveMix=audioCtx.createGain();liveMix.gain.value=1;
  liveMix.connect(masterGain);
  recordDest=audioCtx.createMediaStreamDestination();
  liveMix.connect(recordDest);

  // input → dist → filter → dry ─┬→ liveMix
  //                               ├→ delay → wet → liveMix
  //                               ├→ chorus → wet → liveMix
  //                               └→ reverb → wet → liveMix
  distNode=audioCtx.createWaveShaper();
  distNode.curve=makeDistCurve(0);
  distNode.oversample='2x';

  filterNode=audioCtx.createBiquadFilter();
  filterNode.type='lowpass';filterNode.frequency.value=5000;filterNode.Q.value=2;

  dryGain=audioCtx.createGain();dryGain.gain.value=0.9;

  delayNode=audioCtx.createDelay(1);delayNode.delayTime.value=0.25;
  delayFb=audioCtx.createGain();delayFb.gain.value=0.35;
  delayWet=audioCtx.createGain();delayWet.gain.value=0.15;
  delayNode.connect(delayFb);delayFb.connect(delayNode);delayNode.connect(delayWet);

  chorusDelay=audioCtx.createDelay(0.05);chorusDelay.delayTime.value=0.012;
  chorusLFO=audioCtx.createOscillator();chorusLFO.type='sine';chorusLFO.frequency.value=1.4;
  chorusGain=audioCtx.createGain();chorusGain.gain.value=0.004;
  chorusWet=audioCtx.createGain();chorusWet.gain.value=0;
  chorusLFO.connect(chorusGain);chorusGain.connect(chorusDelay.delayTime);
  chorusLFO.start();
  chorusDelay.connect(chorusWet);

  reverbNode=audioCtx.createConvolver();reverbNode.buffer=makeReverbIR();
  reverbWet=audioCtx.createGain();reverbWet.gain.value=0.1;

  distNode.connect(filterNode);
  filterNode.connect(dryGain);
  dryGain.connect(delayNode);
  dryGain.connect(chorusDelay);
  dryGain.connect(reverbNode);
  reverbNode.connect(reverbWet);

  dryGain.connect(liveMix);
  delayWet.connect(liveMix);
  chorusWet.connect(liveMix);
  reverbWet.connect(liveMix);

  // drums + loops → тот же FX-chain → liveMix
  drumGain=audioCtx.createGain();drumGain.gain.value=0.85;
  drumGain.connect(distNode);

  micGain=audioCtx.createGain();micGain.gain.value=0;
  micGain.connect(distNode);
}
function liveOut(){
  // голоса синтезатора → FX → liveMix (и в колонки, и в запись)
  const g=audioCtx.createGain();
  g.connect(distNode);
  return g;
}
function freqFromMidi(m){return 440*Math.pow(2,(m-69)/12);}
function noteLabel(m){return NOTE_NAMES[m%12]+(Math.floor(m/12)-1);}
function speak(t){
  if(!speechOn||!window.speechSynthesis)return;
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(t);u.lang='ru-RU';u.rate=1.2;u.volume=0.7;
  const v=speechSynthesis.getVoices().find(x=>x.lang.startsWith('ru'));if(v)u.voice=v;
  speechSynthesis.speak(u);
}

/* Voices — ALWAYS hold until stopNote(). No auto-decay. All octaves. */
function createVoice(midi,now){
  const freq=Math.max(20, Math.min(12000, freqFromMidi(midi)));
  const gain=liveOut(), oscs=[], peak=0.25;
  let stopFn=null;

  // Attack, then stay at level forever until releaseAt is called
  function attackHold(atk, level){
    gain.gain.cancelScheduledValues(now);
    gain.gain.setValueAtTime(0, now);
    gain.gain.linearRampToValueAtTime(level, now+Math.max(atk,0.005));
  }
  function releaseAt(t, relSec){
    try{
      gain.gain.cancelScheduledValues(t);
      const cur=Math.max(gain.gain.value, 0.001);
      gain.gain.setValueAtTime(cur, t);
      gain.gain.linearRampToValueAtTime(0, t+relSec);
    }catch(e){}
    oscs.forEach(o=>{ try{ o.stop(t+relSec+0.1); }catch(e){} });
  }

  if(['sine','triangle','sawtooth','square'].includes(timbre)){
    const o=audioCtx.createOscillator(); o.type=timbre; o.frequency.setValueAtTime(freq, now);
    o.connect(gain); o.start(now); oscs.push(o);
    attackHold(0.01, peak);
    stopFn=t=>releaseAt(t, 0.2);
  } else if(timbre==='fm'){
    const car=audioCtx.createOscillator(), mod=audioCtx.createOscillator(), mg=audioCtx.createGain();
    car.type='sine'; mod.type='sine';
    car.frequency.setValueAtTime(freq, now);
    mod.frequency.setValueAtTime(freq*3.5, now);
    mg.gain.value=Math.min(freq*1.8, 4000);
    mod.connect(mg); mg.connect(car.frequency); car.connect(gain);
    car.start(now); mod.start(now); oscs.push(car, mod);
    attackHold(0.01, peak*0.8);
    stopFn=t=>releaseAt(t, 0.2);
  } else if(timbre==='organ'){
    [1,2,3,4].forEach((m,i)=>{
      const o=audioCtx.createOscillator(); o.type='sine'; o.frequency.setValueAtTime(freq*m, now);
      const g=audioCtx.createGain(); g.gain.value=[0.35,0.22,0.12,0.08][i];
      o.connect(g); g.connect(gain); o.start(now); oscs.push(o);
    });
    attackHold(0.02, peak*0.55);
    stopFn=t=>releaseAt(t, 0.25);
  } else if(timbre==='pluck'){
    const o=audioCtx.createOscillator(); o.type='sawtooth'; o.frequency.setValueAtTime(freq, now);
    const f=audioCtx.createBiquadFilter(); f.type='lowpass'; f.Q.value=1.5;
    f.frequency.setValueAtTime(Math.min(Math.max(freq*6, 300), 12000), now);
    o.connect(f); f.connect(gain); o.start(now); oscs.push(o);
    attackHold(0.005, peak);
    stopFn=t=>releaseAt(t, 0.25);
  } else if(timbre==='pad'){
    [0, 0.03, -0.03].forEach(d=>{
      const o=audioCtx.createOscillator(); o.type='sawtooth'; o.frequency.setValueAtTime(freq, now); o.detune.value=d*100;
      const f=audioCtx.createBiquadFilter(); f.type='lowpass'; f.frequency.value=1600;
      o.connect(f); f.connect(gain); o.start(now); oscs.push(o);
    });
    attackHold(0.3, peak*0.4);
    stopFn=t=>releaseAt(t, 0.5);
  } else if(timbre==='bass'){
    const o=audioCtx.createOscillator(); o.type='sawtooth'; o.frequency.setValueAtTime(freq, now);
    const f=audioCtx.createBiquadFilter(); f.type='lowpass'; f.Q.value=3;
    f.frequency.setValueAtTime(Math.min(Math.max(freq*4, 100), 6000), now);
    o.connect(f); f.connect(gain); o.start(now); oscs.push(o);
    attackHold(0.008, peak);
    stopFn=t=>releaseAt(t, 0.2);
  } else {
    const o=audioCtx.createOscillator(); o.type='triangle'; o.frequency.setValueAtTime(freq, now);
    o.connect(gain); o.start(now); oscs.push(o);
    attackHold(0.01, peak);
    stopFn=t=>releaseAt(t, 0.2);
  }
  return {oscs, gain, stopFn};
}
function playNote(midi,keyEl){
  ensureAudio();
  // Уже звучит — не глушить (кроме режима Sus: повторный тап снимает)
  if(activeNotes.has(midi)){
    if(sustain){ stopNote(midi); }
    return;
  }
  if(arpOn){
    if(!arpHeld.includes(midi)){arpHeld.push(midi);arpHeld.sort((a,b)=>a-b);}
    if(keyEl)keyEl.classList.add('active');statusEl.textContent=noteLabel(midi);
    if(!arpTimer)startArp();return;
  }
  const now=audioCtx.currentTime,v=createVoice(midi,now);
  activeNotes.set(midi,{...v,keyEl});if(keyEl)keyEl.classList.add('active');
  statusEl.textContent=noteLabel(midi);speak(noteLabel(midi).replace('#',' диез '));
}
function stopNote(midi){
  if(arpOn){arpHeld=arpHeld.filter(n=>n!==midi);const el=document.querySelector('.key[data-midi="'+midi+'"]');if(el)el.classList.remove('active');if(!arpHeld.length)stopArp();return;}
  const e=activeNotes.get(midi);if(!e)return;if(e.stopFn)e.stopFn(audioCtx.currentTime);activeNotes.delete(midi);if(e.keyEl)e.keyEl.classList.remove('active');
}
function stopAllNotes(){
  for(const m of[...activeNotes.keys()]){const e=activeNotes.get(m);if(e?.stopFn)e.stopFn(audioCtx.currentTime);if(e?.keyEl)e.keyEl.classList.remove('active');}
  activeNotes.clear();arpHeld=[];stopArp();document.querySelectorAll('.key.active').forEach(k=>k.classList.remove('active'));
}
function startArp(){if(arpTimer)return;arpIndex=0;arpDir=1;arpStep();}
function stopArp(){if(arpTimer){clearTimeout(arpTimer);arpTimer=null;}for(const m of[...activeNotes.keys()]){const e=activeNotes.get(m);if(e?.stopFn)e.stopFn(audioCtx.currentTime);}activeNotes.clear();}
function arpStep(){
  if(!arpOn||!arpHeld.length){stopArp();return;}ensureAudio();const now=audioCtx.currentTime;
  for(const m of[...activeNotes.keys()]){const e=activeNotes.get(m);if(e?.stopFn)e.stopFn(now);}activeNotes.clear();
  let notes=[];if(arpPattern==='chord')notes=[...arpHeld];
  else{let idx;if(arpPattern==='up'){idx=arpIndex%arpHeld.length;arpIndex++;}
    else if(arpPattern==='down'){idx=arpHeld.length-1-(arpIndex%arpHeld.length);arpIndex++;}
    else if(arpPattern==='updown'){if(arpHeld.length===1)idx=0;else{idx=arpIndex;arpIndex+=arpDir;if(arpIndex>=arpHeld.length-1)arpDir=-1;if(arpIndex<=0)arpDir=1;}}
    else idx=Math.floor(Math.random()*arpHeld.length);notes=[arpHeld[idx]];}
  notes.forEach(midi=>{const v=createVoice(midi,now);const gate=Math.min(arpRateMs/1000*0.8,0.3);
    v.gain.gain.cancelScheduledValues(now);v.gain.gain.setValueAtTime(0.0001,now);v.gain.gain.exponentialRampToValueAtTime(0.2,now+0.008);v.gain.gain.exponentialRampToValueAtTime(0.0001,now+gate);
    activeNotes.set(midi,v);statusEl.textContent=noteLabel(midi);});
  arpTimer=setTimeout(arpStep,arpRateMs);
}

/* Drums */
function playDrum(id){
  ensureAudio();const now=audioCtx.currentTime,out=drumGain;
  if(id==='kick'){const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='sine';o.frequency.setValueAtTime(150,now);o.frequency.exponentialRampToValueAtTime(40,now+0.12);g.gain.setValueAtTime(1,now);g.gain.exponentialRampToValueAtTime(0.001,now+0.35);o.connect(g);g.connect(out);o.start(now);o.stop(now+0.4);}
  else if(id==='snare'){const len=Math.floor(audioCtx.sampleRate*0.2);const buf=audioCtx.createBuffer(1,len,audioCtx.sampleRate);const d=buf.getChannelData(0);for(let i=0;i<len;i++)d[i]=Math.random()*2-1;const n=audioCtx.createBufferSource();n.buffer=buf;const f=audioCtx.createBiquadFilter();f.type='highpass';f.frequency.value=1200;const g=audioCtx.createGain();g.gain.setValueAtTime(0.65,now);g.gain.exponentialRampToValueAtTime(0.001,now+0.18);n.connect(f);f.connect(g);g.connect(out);n.start(now);const o=audioCtx.createOscillator(),og=audioCtx.createGain();o.type='triangle';o.frequency.value=180;og.gain.setValueAtTime(0.45,now);og.gain.exponentialRampToValueAtTime(0.001,now+0.1);o.connect(og);og.connect(out);o.start(now);o.stop(now+0.12);}
  else if(id==='hat'){const len=Math.floor(audioCtx.sampleRate*0.06);const buf=audioCtx.createBuffer(1,len,audioCtx.sampleRate);const d=buf.getChannelData(0);for(let i=0;i<len;i++)d[i]=Math.random()*2-1;const n=audioCtx.createBufferSource();n.buffer=buf;const f=audioCtx.createBiquadFilter();f.type='highpass';f.frequency.value=7000;const g=audioCtx.createGain();g.gain.setValueAtTime(0.3,now);g.gain.exponentialRampToValueAtTime(0.001,now+0.04);n.connect(f);f.connect(g);g.connect(out);n.start(now);}
  else if(id==='ohat'){const len=Math.floor(audioCtx.sampleRate*0.35);const buf=audioCtx.createBuffer(1,len,audioCtx.sampleRate);const d=buf.getChannelData(0);for(let i=0;i<len;i++)d[i]=Math.random()*2-1;const n=audioCtx.createBufferSource();n.buffer=buf;const f=audioCtx.createBiquadFilter();f.type='highpass';f.frequency.value=6000;const g=audioCtx.createGain();g.gain.setValueAtTime(0.28,now);g.gain.exponentialRampToValueAtTime(0.001,now+0.3);n.connect(f);f.connect(g);g.connect(out);n.start(now);}
  else if(id==='clap'){const len=Math.floor(audioCtx.sampleRate*0.22);const buf=audioCtx.createBuffer(1,len,audioCtx.sampleRate);const d=buf.getChannelData(0);for(let i=0;i<len;i++)d[i]=Math.random()*2-1;const n=audioCtx.createBufferSource();n.buffer=buf;const f=audioCtx.createBiquadFilter();f.type='bandpass';f.frequency.value=1500;const g=audioCtx.createGain();g.gain.setValueAtTime(0.001,now);g.gain.linearRampToValueAtTime(0.6,now+0.002);g.gain.exponentialRampToValueAtTime(0.001,now+0.18);n.connect(f);f.connect(g);g.connect(out);n.start(now);}
  else if(id==='tom'){const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='sine';o.frequency.setValueAtTime(200,now);o.frequency.exponentialRampToValueAtTime(80,now+0.14);g.gain.setValueAtTime(0.7,now);g.gain.exponentialRampToValueAtTime(0.001,now+0.28);o.connect(g);g.connect(out);o.start(now);o.stop(now+0.3);}
  else if(id==='rim'){const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='square';o.frequency.value=800;g.gain.setValueAtTime(0.2,now);g.gain.exponentialRampToValueAtTime(0.001,now+0.04);const f=audioCtx.createBiquadFilter();f.type='bandpass';f.frequency.value=1200;f.Q.value=5;o.connect(f);f.connect(g);g.connect(out);o.start(now);o.stop(now+0.05);}
  else if(id==='perc'){const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='triangle';o.frequency.setValueAtTime(550,now);o.frequency.exponentialRampToValueAtTime(180,now+0.07);g.gain.setValueAtTime(0.35,now);g.gain.exponentialRampToValueAtTime(0.001,now+0.14);o.connect(g);g.connect(out);o.start(now);o.stop(now+0.16);}
}

/* Generate loop buffers */
function generateLoopBuffer(style){
  ensureAudio();
  const sr=audioCtx.sampleRate;
  const steps=16*style.bars;
  const stepDur=60/style.bpm/4; // 16th note
  const totalDur=stepDur*steps;
  const len=Math.floor(totalDur*sr);
  const buf=audioCtx.createBuffer(1,len,sr);
  const data=buf.getChannelData(0);
  const map={K:'kick',S:'snare',H:'hat',O:'ohat',C:'clap',T:'tom',R:'rim',P:'perc'};
  // Render simple one-shots into buffer offline-ish by mixing samples
  function hit(type,atSec,vel){
    const at=Math.floor(atSec*sr);
    if(type==='kick'){for(let i=0;i<Math.min(sr*0.35,len-at);i++){const t=i/sr;const env=Math.exp(-t*8);const f=150*Math.exp(-t*20)+40;data[at+i]+=vel*env*Math.sin(2*Math.PI*f*t)*0.9;}}
    else if(type==='snare'){for(let i=0;i<Math.min(sr*0.18,len-at);i++){const t=i/sr;const env=Math.exp(-t*12);data[at+i]+=vel*env*((Math.random()*2-1)*0.5+Math.sin(2*Math.PI*180*t)*0.3);}}
    else if(type==='hat'){for(let i=0;i<Math.min(sr*0.05,len-at);i++){const t=i/sr;data[at+i]+=vel*Math.exp(-t*40)*(Math.random()*2-1)*0.25;}}
    else if(type==='ohat'){for(let i=0;i<Math.min(sr*0.3,len-at);i++){const t=i/sr;data[at+i]+=vel*Math.exp(-t*6)*(Math.random()*2-1)*0.22;}}
    else if(type==='clap'){for(let i=0;i<Math.min(sr*0.2,len-at);i++){const t=i/sr;data[at+i]+=vel*Math.exp(-t*10)*(Math.random()*2-1)*0.4;}}
    else if(type==='tom'){for(let i=0;i<Math.min(sr*0.28,len-at);i++){const t=i/sr;const f=200*Math.exp(-t*8)+70;data[at+i]+=vel*Math.exp(-t*7)*Math.sin(2*Math.PI*f*t)*0.6;}}
    else if(type==='rim'){for(let i=0;i<Math.min(sr*0.04,len-at);i++){const t=i/sr;data[at+i]+=vel*Math.exp(-t*50)*Math.sin(2*Math.PI*800*t)*0.35;}}
    else if(type==='perc'){for(let i=0;i<Math.min(sr*0.14,len-at);i++){const t=i/sr;const f=550*Math.exp(-t*10)+150;data[at+i]+=vel*Math.exp(-t*12)*Math.sin(2*Math.PI*f*t)*0.3;}}
  }
  Object.keys(style.pat).forEach(k=>{
    const pat=style.pat[k];const type=map[k];if(!type)return;
    for(let i=0;i<Math.min(pat.length,steps);i++){if(pat[i]==='x')hit(type,i*stepDur,0.85+Math.random()*0.15);}
  });
  // soft clip
  for(let i=0;i<len;i++)data[i]=Math.max(-1,Math.min(1,data[i]));
  return buf;
}

function startLoopPlayback(name, style){
  const lp=loopPlayers[name];
  if(!lp||!lp.buffer) return;
  try{lp.src?.stop();}catch(e){}
  const src=audioCtx.createBufferSource();
  src.buffer=lp.buffer;
  src.loop=true;
  const g=audioCtx.createGain();g.gain.value=0.75;
  src.connect(g);g.connect(drumGain); // FX → liveMix → запись = то, что слышишь
  src.start(0);
  lp.src=src;lp.gain=g;lp.playing=true;lp.style=style||lp.style;
}
function buildLoops(){
  const el=document.getElementById('loops');el.innerHTML='';
  LOOP_STYLES.forEach(style=>{

    b.dataset.loop=style.name;

      if(!loopPlayers[style.name]?.buffer){

        loopPlayers[style.name]={buffer:generateLoopBuffer(style),playing:false,src:null,gain:null,style:style};
      }

      statusEl.textContent=style.name+' ON';
    });
    el.appendChild(b);
  });
}
function stopLoop(name){

/* Запись liveMix (post-FX) через ScriptProcessor — стабильно, с эффектами */
function startLiveRec(){
  recChunks=[]; recLength=0;
  const bs=2048;
  try{
    recProc=audioCtx.createScriptProcessor(bs,1,1);
  }catch(e){
    statusEl.textContent='Rec n/a';
    return false;
  }
  recProc.onaudioprocess=function(e){
    if(!isRec) return;
    const input=e.inputBuffer.getChannelData(0);
    recChunks.push(new Float32Array(input));
    recLength+=input.length;
  };
  liveMix.connect(recProc);
  recSilent=audioCtx.createGain();
  recSilent.gain.value=0;
  recProc.connect(recSilent);
  recSilent.connect(audioCtx.destination);
  return true;
}
function stopLiveRec(){
  isRec=false;
  if(recProc){
    try{liveMix.disconnect(recProc);}catch(e){}
    try{recProc.disconnect();}catch(e){}
    recProc.onaudioprocess=null;
    recProc=null;
  }
  if(recSilent){
    try{recSilent.disconnect();}catch(e){}
    recSilent=null;
  }
  if(recLength<512){
    statusEl.textContent='Слишком коротко';
    recChunks=[]; recLength=0;
    return;
  }
  const sr=audioCtx.sampleRate;
  let buf=audioCtx.createBuffer(1,recLength,sr);
  const data=buf.getChannelData(0);
  let off=0;
  for(let i=0;i<recChunks.length;i++){
    data.set(recChunks[i],off);
    off+=recChunks[i].length;
  }
  recChunks=[]; recLength=0;
  // выровнять по длине 1-й дорожки
  if(tracks.length&&tracks[0].buffer){
    const target=tracks[0].buffer.length;
    if(buf.length!==target){
      const aligned=audioCtx.createBuffer(1,target,sr);
      const n=Math.min(buf.length,target);
      aligned.getChannelData(0).set(buf.getChannelData(0).subarray(0,n));
      buf=aligned;
    }
  }
  addTrack(buf, micEnabled?'Live+Mic':'Live');
  statusEl.textContent='Трек + (с FX)';
}
function toggleTrackRec(){
  ensureAudio();
  const btn=document.getElementById('recTrackBtn');
  if(!isRec){
    playAllTracks(true);
    restartPlayingLoops();
    if(!startLiveRec()) return;
    isRec=true;
    btn.classList.add('rec-on');btn.textContent='■ Стоп';statusEl.textContent='● REC';
  } else {
    stopLiveRec();
    btn.classList.remove('rec-on');btn.textContent='● Запись';
    stopPlayAll();
  }
}
function addTrack(buffer,type){
  const id=nextId++;
  tracks.push({id:id,name:'T'+id+' '+type,buffer,gainValue:0.85,muted:false});
  renderTracks();
}
function renderTracks(){
  tracksList.innerHTML='';trackCountEl.textContent=tracks.length;
  tracks.forEach(t=>{
    const d=document.createElement('div');d.className='track'+(t.muted?' muted':'');
    d.innerHTML='<div class="track-row"><span class="track-name">'+t.name+'</span>'+
      '<button data-a="m" data-id="'+t.id+'">'+(t.muted?'🔇':'🔊')+'</button>'+
      '<button data-a="d" data-id="'+t.id+'">✕</button></div>'+
      '<div class="track-row"><input type="range" class="track-vol" min="0" max="100" value="'+(t.gainValue*100)+'" data-id="'+t.id+'"></div>';
    tracksList.appendChild(d);
  });
  tracksList.querySelectorAll('button').forEach(b=>{
    b.addEventListener('click',()=>{const t=tracks.find(x=>x.id==+b.dataset.id);if(!t)return;
      if(b.dataset.a==='m'){
        t.muted=!t.muted;
        playSrcs.forEach(p=>{
          if(p.id===t.id && p.gain)
            p.gain.gain.setTargetAtTime(t.muted?0:t.gainValue, audioCtx.currentTime, 0.02);
        });
        renderTracks();
      }
      if(b.dataset.a==='d'){tracks=tracks.filter(x=>x.id!==t.id);renderTracks();}});
  });
  tracksList.querySelectorAll('.track-vol').forEach(sl=>{
    sl.addEventListener('input',()=>{
      const t=tracks.find(x=>x.id==+sl.dataset.id);
      if(!t) return;
      t.gainValue=sl.value/100;
      // обновить громкость, если дорожка сейчас играет
      playSrcs.forEach(p=>{
        if(p.id===t.id && p.gain){
          p.gain.gain.setTargetAtTime(t.muted?0:t.gainValue, audioCtx.currentTime, 0.02);
        }
      });
    });
  });
}
function playAllTracks(silent){
  ensureAudio();stopPlayAll();
  if(!tracks.length&&!silent){statusEl.textContent='Нет дорожек';return;}
  // при записи (silent) стартуем сразу — синхрон с sample-rec; иначе небольшой pre-roll
  const now=silent ? audioCtx.currentTime : audioCtx.currentTime+0.03;
  tracks.forEach(t=>{
    if(t.muted||!t.buffer)return;
    const src=audioCtx.createBufferSource();src.buffer=t.buffer;
    const g=audioCtx.createGain();g.gain.value=t.gainValue;
    src.connect(g);g.connect(masterGain); // только master — мимо liveMix/записи
    src.start(now);
    playSrcs.push({src:src, gain:g, id:t.id});
  });
  if(!silent){statusEl.textContent='▶ Playing';document.getElementById('playAllBtn').classList.add('on');}
}
function stopPlayAll(){
  playSrcs.forEach(p=>{try{p.src.stop();}catch(e){}});
  playSrcs=[];
  document.getElementById('playAllBtn').classList.remove('on');
}


const PROJ_DB='SynthStudioDB', PROJ_STORE='projects', PROJ_KEY='current';

function openProjDB(){
  return new Promise((resolve,reject)=>{
    const req=indexedDB.open(PROJ_DB, 1);
    req.onupgradeneeded=()=>{
      const db=req.result;
      if(!db.objectStoreNames.contains(PROJ_STORE)) db.createObjectStore(PROJ_STORE);
    };
    req.onsuccess=()=>resolve(req.result);
    req.onerror=()=>reject(req.error);
  });
}
async function idbSaveProject(project){
  const db=await openProjDB();
  return new Promise((resolve,reject)=>{
    const tx=db.transaction(PROJ_STORE,'readwrite');
    tx.objectStore(PROJ_STORE).put(project, PROJ_KEY);
    tx.oncomplete=()=>resolve();
    tx.onerror=()=>reject(tx.error);
  });
}
async function idbLoadProject(){
  const db=await openProjDB();
  return new Promise((resolve,reject)=>{
    const tx=db.transaction(PROJ_STORE,'readonly');
    const req=tx.objectStore(PROJ_STORE).get(PROJ_KEY);
    req.onsuccess=()=>resolve(req.result||null);
    req.onerror=()=>reject(req.error);
  });
}

function arrayBufferToBase64(buf){
  const bytes=new Uint8Array(buf);
  let s=''; const chunk=0x8000;
  for(let i=0;i<bytes.length;i+=chunk){
    s+=String.fromCharCode.apply(null, bytes.subarray(i, Math.min(i+chunk, bytes.length)));
  }
  return btoa(s);
}
function base64ToArrayBuffer(b64){
  const s=atob(b64);
  const bytes=new Uint8Array(s.length);
  for(let i=0;i<s.length;i++) bytes[i]=s.charCodeAt(i);
  return bytes.buffer;
}

      name:t.name,
      gainValue:t.gainValue,
      muted:!!t.muted,
      wav:arrayBufferToBase64(wav)
    });
  }
  return {
    v:1,
    type:'synth-studio-project',
    savedAt:new Date().toISOString(),
    settings:{
      timbre:timbre,
      baseOctave:baseOctave,
      sustain:sustain,
      arpOn:arpOn,
      arpPattern:arpPattern,
      arpRateMs:arpRateMs,
      fx:getFxSettings()
    },
    nextId:nextId,
    tracks:trackData
  };
}
async function applyProjectData(project){
  if(!project||project.type!=='synth-studio-project') return false;
  ensureAudio();
  stopPlayAll(); stopAllNotes(); stopAllLoops();
  tracks=[];
  const s=project.settings||{};
  if(s.timbre){ timbre=s.timbre; const el=document.getElementById('timbre'); if(el) el.value=timbre; }
  if(s.baseOctave!=null){ baseOctave=+s.baseOctave; const el=document.getElementById('baseOctave'); if(el) el.value=String(baseOctave); buildKeyboard(); }
  if(s.arpPattern){ arpPattern=s.arpPattern; const el=document.getElementById('arpPattern'); if(el) el.value=arpPattern; }
  if(s.arpRateMs!=null){ arpRateMs=+s.arpRateMs; const el=document.getElementById('arpRate'); if(el) el.value=arpRateMs; }
  if(typeof s.sustain==='boolean'){ sustain=s.sustain; document.getElementById('sustainBtn').classList.toggle('on',sustain); }
  if(typeof s.arpOn==='boolean'){ arpOn=s.arpOn; document.getElementById('arpBtn').classList.toggle('on',arpOn); }
  applyFxSettings(s.fx);
  nextId=project.nextId||1;
  for(const td of (project.tracks||[])){
    if(!td.wav) continue;
    const ab=base64ToArrayBuffer(td.wav);
    const buf=await audioCtx.decodeAudioData(ab.slice(0));
    const id=nextId++;
    tracks.push({id:id, name:td.name||('T'+id), buffer:buf, gainValue:td.gainValue!=null?td.gainValue:0.85, muted:!!td.muted});
  }
  renderTracks();
  return true;
}

async function exportMix(){
  if(!tracks.length){statusEl.textContent='Нет дорожек';return;}
  ensureAudio();statusEl.textContent='Сжатие…';
  const maxDur=Math.max(...tracks.filter(t=>t.buffer).map(t=>t.buffer.duration),0.1);
  // offline mix
  const off=new OfflineAudioContext(2,Math.ceil(maxDur*audioCtx.sampleRate),audioCtx.sampleRate);
  tracks.forEach(t=>{
    if(!t.buffer||t.muted)return;
    const s=off.createBufferSource();s.buffer=t.buffer;
    const g=off.createGain();g.gain.value=t.gainValue;
    s.connect(g);g.connect(off.destination);s.start(0);
  });
  const ren=await off.startRendering();
  // сжатый Opus/WebM через MediaRecorder (намного меньше WAV, качество высокое)
  try{
    const msDest=audioCtx.createMediaStreamDestination();
    const src=audioCtx.createBufferSource();src.buffer=ren;
    const mute=audioCtx.createGain();mute.gain.value=0;
    src.connect(msDest);src.connect(mute);mute.connect(audioCtx.destination);
    let mime='audio/webm;codecs=opus';
    if(!MediaRecorder.isTypeSupported(mime)) mime='audio/webm';
    const chunks=[];
    const mr=new MediaRecorder(msDest.stream,{mimeType:mime,audioBitsPerSecond:160000});
    mr.ondataavailable=e=>{if(e.data.size>0)chunks.push(e.data);};
    const done=new Promise(res=>{mr.onstop=()=>res();});
    mr.start(100);
    src.start();
    src.onended=()=>{setTimeout(()=>{try{mr.stop();}catch(e){}},80);};
    // safety timeout
    setTimeout(()=>{try{if(mr.state!=='inactive')mr.stop();}catch(e){}}, (maxDur+1)*1000);
    await done;
    const blob=new Blob(chunks,{type:mime});
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download='mix-'+Date.now()+'.webm';
    a.click();
    URL.revokeObjectURL(a.href);
    statusEl.textContent='Opus ✓ ('+Math.round(blob.size/1024)+' КБ)';
  }catch(err){
    // fallback: mono 22kHz WAV (меньше стерео 48k)
    const monoLen=Math.floor(ren.duration*22050);
    const mono=audioCtx.createBuffer(1,monoLen,22050);
    const out=mono.getChannelData(0);
    const L=ren.getChannelData(0), R=ren.numberOfChannels>1?ren.getChannelData(1):L;
    for(let i=0;i<monoLen;i++){
      const srcIdx=Math.min(ren.length-1, Math.floor(i*ren.sampleRate/22050));
      out[i]=(L[srcIdx]+R[srcIdx])*0.5;
    }
    const wav=bufToWav(mono);
    const blob=new Blob([wav],{type:'audio/wav'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='mix-'+Date.now()+'.wav';a.click();
    statusEl.textContent='WAV 22k ✓';
  }
}
function bufToWav(buffer){
  const nCh=buffer.numberOfChannels,sr=buffer.sampleRate,ab=new ArrayBuffer(44+buffer.length*nCh*2),v=new DataView(ab);
  const ws=(o,s)=>{for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i));};
  ws(0,'RIFF');v.setUint32(4,36+buffer.length*nCh*2,true);ws(8,'WAVE');ws(12,'fmt ');
  v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,nCh,true);v.setUint32(24,sr,true);
  v.setUint32(28,sr*nCh*2,true);v.setUint16(32,nCh*2,true);v.setUint16(34,16,true);ws(36,'data');v.setUint32(40,buffer.length*nCh*2,true);
  let o=44;for(let i=0;i<buffer.length;i++)for(let c=0;c<nCh;c++){const s=Math.max(-1,Math.min(1,buffer.getChannelData(c)[i]));v.setInt16(o,s<0?s*0x8000:s*0x7FFF,true);o+=2;}
  return ab;
}

/* Mic */
async function toggleMic(){
  ensureAudio();
  const mb=document.getElementById('micBtn');
  if(!micEnabled){
    // file:// — браузер НЕ показывает «Разрешить» и блокирует mic
    if(location.protocol==='file:'){
      alert(
        'Микрофон не работает при открытии файла напрямую.\\n\\n'+
        'Браузер блокирует mic на file:// и не показывает «Разрешить».\\n\\n'+
        'Сделай так:\\n'+
        '1. Залей index.html на GitHub Pages (или Netlify Drop)\\n'+
        '2. Открой ссылку https://…\\n'+
        '3. Нажми 🎙 Mic → появится «Разрешить»'
      );
      statusEl.textContent='Mic: нужен https';
      return;
    }
    try{
      if(audioCtx.state==='suspended') await audioCtx.resume();
      if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){
        alert('Браузер не поддерживает микрофон');
        return;
      }
      micStream=await navigator.mediaDevices.getUserMedia({audio:true});
      micSource=audioCtx.createMediaStreamSource(micStream);
      micSource.connect(micGain);
      micGain.gain.value=0.9;
      micEnabled=true;
      mb.classList.add('on'); mb.textContent='🎙 ON';
      statusEl.textContent='Mic ON';
    }catch(e){
      const name=(e&&e.name)||'Error';
      statusEl.textContent='Mic: '+name;
      if(name==='NotAllowedError'||name==='PermissionDeniedError'){
        alert(
          'Микрофон заблокирован для этого сайта.\\n\\n'+
          '1. Нажми 🔒 слева от адреса\\n'+
          '2. Микрофон → Разрешить\\n'+
          '3. Обнови страницу и снова 🎙 Mic\\n\\n'+
          'Адрес: '+location.href
        );
      } else {
        alert('Микрофон: '+name+'\\n'+(e&&e.message?e.message:'')+'\\n'+location.href);
      }
    }
  } else {
    micGain.gain.value=0;
    if(micStream) micStream.getTracks().forEach(t=>t.stop());
    micStream=null; micSource=null; micEnabled=false;
    mb.classList.remove('on'); mb.textContent='🎙 Mic';
    statusEl.textContent='Mic OFF';
  }
}

/* Keyboard */
function buildKeyboard(){
  keyboard.innerHTML='';document.getElementById('octaveLabels').innerHTML='';
  const wDiv=document.createElement('div');wDiv.className='white-keys';
  const bDiv=document.createElement('div');bDiv.className='black-keys';
  // MIDI C of octave N = (N+1)*12 → C2=36, C3=48, C4=60. 2 octaves = +24 semitones.
  const startMidi=(baseOctave+1)*12;
  const totalW=15;
  for(let o=0;o<2;o++){const s=document.createElement('span');s.textContent='О.'+(baseOctave+o);document.getElementById('octaveLabels').appendChild(s);}
  const last=document.createElement('span');last.textContent='C'+(baseOctave+2);document.getElementById('octaveLabels').appendChild(last);
  for(let i=0;i<totalW;i++){
    const oct=Math.floor(i/7),wi=i%7,isLast=i===totalW-1;
    const midi=isLast?(startMidi+24):(startMidi+oct*12+WHITE_NOTES[wi]);
    const key=document.createElement('div');key.className='key white';key.dataset.midi=String(midi);key.textContent=noteLabel(midi);wDiv.appendChild(key);
    if(!isLast&&[0,1,3,4,5].includes(wi)){
      const bo={0:1,1:3,3:6,4:8,5:10}[wi];const bm=startMidi+oct*12+bo;
      const black=document.createElement('div');black.className='key black';black.dataset.midi=String(bm);black.textContent=noteLabel(bm);
      const ww=100/totalW;black.style.left=((i+0.68)*ww-ww*0.55)+'%';black.style.width=(ww*1.15)+'%';bDiv.appendChild(black);
    }
  }
  keyboard.appendChild(wDiv);keyboard.appendChild(bDiv);

  // Мультитач. Важно: не давать mouse/pointer-событиям после touch глушить ноту.
  const fingerNotes = new Map(); // id -> midi
  let lastTouchTs = 0;

  function keyFromPoint(x, y){
    const stack = document.elementsFromPoint(x, y);
    for (let i = 0; i < stack.length; i++) {
      const el = stack[i];
      if (el.classList && el.classList.contains('key') && el.dataset.midi) return el;
    }
    return null;
  }

  function fingerDown(id, x, y){
    const key = keyFromPoint(x, y);
    if (!key) return;
    const midi = +key.dataset.midi;
    if (fingerNotes.has(id)) {
      const prev = fingerNotes.get(id);
      if (prev !== midi && !sustain) stopNote(prev);
    }
    fingerNotes.set(id, midi);
    playNote(midi, key);
  }

  function fingerMove(id, x, y){
    if (!fingerNotes.has(id)) return;
    const prev = fingerNotes.get(id);
    const key = keyFromPoint(x, y);
    if (!key) return;
    const midi = +key.dataset.midi;
    if (midi === prev) return;
    if (!sustain) stopNote(prev);
    fingerNotes.set(id, midi);
    playNote(midi, key);
  }

  function fingerUp(id){
    if (!fingerNotes.has(id)) return;
    const midi = fingerNotes.get(id);
    fingerNotes.delete(id);
    if (!sustain) stopNote(midi);
  }

  keyboard.addEventListener('touchstart', function(e){
    e.preventDefault();
    e.stopPropagation();
    lastTouchTs = Date.now();
    ensureAudio();
    for (let i = 0; i < e.changedTouches.length; i++) {
      const t = e.changedTouches[i];
      fingerDown('t' + t.identifier, t.clientX, t.clientY);
    }
  }, { passive: false });

  keyboard.addEventListener('touchmove', function(e){
    e.preventDefault();
    lastTouchTs = Date.now();
    for (let i = 0; i < e.changedTouches.length; i++) {
      const t = e.changedTouches[i];
      fingerMove('t' + t.identifier, t.clientX, t.clientY);
    }
  }, { passive: false });

  keyboard.addEventListener('touchend', function(e){
    e.preventDefault();
    lastTouchTs = Date.now();
    for (let i = 0; i < e.changedTouches.length; i++) {
      fingerUp('t' + e.changedTouches[i].identifier);
    }
  }, { passive: false });

  keyboard.addEventListener('touchcancel', function(e){
    lastTouchTs = Date.now();
    for (let i = 0; i < e.changedTouches.length; i++) {
      fingerUp('t' + e.changedTouches[i].identifier);
    }
  }, { passive: false });

  // Мышь только если это не «ложный» click после touch
  function isGhostMouse(){ return (Date.now() - lastTouchTs) < 800; }

  keyboard.addEventListener('pointerdown', function(e){
    if (e.pointerType === 'touch') return;
    if (isGhostMouse()) { e.preventDefault(); return; }
    if (e.button !== 0) return;
    e.preventDefault();
    ensureAudio();
    try { keyboard.setPointerCapture(e.pointerId); } catch (err) {}
    fingerDown('p' + e.pointerId, e.clientX, e.clientY);
  });
  keyboard.addEventListener('pointermove', function(e){
    if (e.pointerType === 'touch') return;
    if (isGhostMouse()) return;
    if (!fingerNotes.has('p' + e.pointerId)) return;
    fingerMove('p' + e.pointerId, e.clientX, e.clientY);
  });
  keyboard.addEventListener('pointerup', function(e){
    if (e.pointerType === 'touch') return;
    if (isGhostMouse()) return;
    fingerUp('p' + e.pointerId);
  });
  keyboard.addEventListener('pointercancel', function(e){
    if (e.pointerType === 'touch') return;
    fingerUp('p' + e.pointerId);
  });
}

/* MIDI — USB Type-C / OTG на телефоне */
function onMIDI(ev){
  ensureAudio();
  const d=ev.data; if(!d||d.length<2) return;
  const st=d[0], note=d[1], vel=d.length>2?d[2]:0;
  const cmd=st&0xf0;
  if(cmd===0x90 && vel>0){
    const keyEl=document.querySelector('.key[data-midi="'+note+'"]');
    playNote(note, keyEl);
  } else if(cmd===0x80 || (cmd===0x90 && vel===0)){
    stopNote(note);
  } else if(cmd===0xB0 && note===64){
    // Sustain pedal
    sustain = vel>=64;
    document.getElementById('sustainBtn').classList.toggle('on', sustain);
  }
}
function hookMidiInputs(){
  if(!midiAccess) return;
  const names=[];
  midiAccess.inputs.forEach(input=>{
    input.onmidimessage = onMIDI;
    names.push(input.name||'MIDI');
  });
  const info=document.getElementById('midiInfo');
  const btn=document.getElementById('midiBtn');
  if(names.length){
    info.textContent='MIDI: '+names.join(', ');
    btn.classList.add('on');
    statusEl.textContent='MIDI OK';
  } else {
    info.textContent='MIDI: ждём клавиатуру…';
    btn.classList.remove('on');
  }
}
async function initMIDI(){
  if(!navigator.requestMIDIAccess){
    document.getElementById('midiInfo').textContent='MIDI: не поддерживается';
    alert('Web MIDI не поддерживается в этом браузере.\n\nAndroid: открой в Chrome, кабель Type-C OTG.\niPhone: Web MIDI почти недоступен.');
    return;
  }
  try{
    midiAccess = await navigator.requestMIDIAccess({ sysex: false });
    hookMidiInputs();
    midiAccess.onstatechange = function(e){
      hookMidiInputs();
      const p=e.port;
      if(p && p.type==='input'){
        statusEl.textContent = (p.state==='connected' ? 'MIDI + ' : 'MIDI − ') + (p.name||'');
      }
    };
  } catch(err){
    document.getElementById('midiInfo').textContent='MIDI: нет доступа';
    alert('Нет доступа к MIDI.\nAndroid: Chrome + OTG Type-C кабель.');
  }
}

async function forceLandscape(){
  try{
    const el=document.documentElement;
    if(screen.orientation&&screen.orientation.lock){
      // fullscreen помогает lock на Android
      if(!document.fullscreenElement&&el.requestFullscreen){
        try{ await el.requestFullscreen({navigationUI:'hide'}); }catch(e){
          try{ await el.requestFullscreen(); }catch(e2){}
        }
      }
      try{ await screen.orientation.lock('landscape'); }
      catch(e1){
        try{ await screen.orientation.lock('landscape-primary'); }catch(e2){
          try{ await screen.orientation.lock('landscape-secondary'); }catch(e3){}
        }
      }
    }
  }catch(e){}
}
// при первом касании — lock + audio
document.body.addEventListener('pointerdown',()=>{
  ensureAudio();
  forceLandscape();
  if(!midiAccess&&navigator.requestMIDIAccess)initMIDI();
},{once:true});
// повторные попытки lock
setTimeout(forceLandscape, 200);
window.addEventListener('orientationchange',()=>setTimeout(forceLandscape, 150));
window.addEventListener('resize',()=>setTimeout(forceLandscape, 150));
if(window.speechSynthesis){speechSynthesis.getVoices();speechSynthesis.onvoiceschanged=()=>speechSynthesis.getVoices();}
})();
