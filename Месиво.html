<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Synth Studio · 3 oct</title>
<!-- Подключаем lamejs для возможности экспорта в MP3 -->
<script src="https://cdn.jsdelivr.net/npm/lamejs@1.2.1/lame.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;width:100%;background:#160a18;color:#f5e8f4;font-family:system-ui,sans-serif;overflow:hidden;touch-action:none;user-select:none}
.app{display:grid;grid-template-rows:auto auto 1fr auto auto;grid-template-columns:1fr 190px;height:100%;max-width:1100px;margin:0 auto}
.topbar{grid-column:1/-1;display:flex;flex-wrap:nowrap;gap:4px;align-items:center;padding:3px 6px;background:linear-gradient(180deg,#2a1430,#160a18);border-bottom:1px solid #4a2a50;overflow-x:auto;scrollbar-width:none}
.topbar::-webkit-scrollbar{display:none}
h1{font-size:.75rem;color:#d0a0c8;white-space:nowrap}
.controls{display:flex;flex-wrap:nowrap;gap:4px;align-items:center}
label{font-size:.58rem;color:#a08098;display:flex;align-items:center;gap:2px;white-space:nowrap}
select,button,input[type=number],input[type=text]{background:#2a1834;color:#f0e0f0;border:1px solid #5a3a60;border-radius:5px;padding:3px 6px;font-size:.68rem;cursor:pointer}
button{background:#321c3c;transition:.1s}
button:active{transform:scale(.95)}
button.on{background:#7a4090;border-color:#c080d0;color:#fff}
button.rec-on{background:#a03070;border-color:#e070b0;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.65}}
.status{font-size:.58rem;color:#a08098;min-width:48px}
.fxbar{grid-column:1/-1;display:flex;flex-wrap:nowrap;gap:6px;align-items:center;padding:2px 6px;background:#1c1024;border-bottom:1px solid #3a2848;overflow-x:auto;scrollbar-width:none}
.fx-group{display:flex;align-items:center;gap:3px;padding:0 5px;border-right:1px solid #3a2848}
.fx-group span{font-size:.55rem;color:#a08098;min-width:26px}
input[type=range]{width:52px;height:12px;accent-color:#c070c0;padding:0}
input[type=range].wide{width:90px}
input[type=number]{width:48px;padding:2px 4px;font-size:.65rem;text-align:center}
.kb-wrap{grid-column:1;display:flex;flex-direction:column;padding:2px 3px;min-height:0}
.oct-lab{display:flex;justify-content:space-around;font-size:.48rem;color:#705870;padding-bottom:1px}
.keys{flex:1;display:flex;position:relative;min-height:70px;touch-action:none}
.white-keys{display:flex;width:100%;height:100%}
.key{flex:1;border-radius:0 0 5px 5px;border:1px solid #1a1020;display:flex;align-items:flex-end;justify-content:center;padding-bottom:6px;font-size:.55rem;font-weight:500}
.white{background:linear-gradient(180deg,#f8f0f8,#e0d0e8);color:#402050;box-shadow:0 2px 0 #b0a0b8}
.white.active{background:linear-gradient(180deg,#e0c0e8,#c0a0d0);transform:translateY(1px)}
.black-keys{position:absolute;top:0;left:0;right:0;height:54%;pointer-events:none}
.black{position:absolute;height:100%;background:linear-gradient(180deg,#3a2848,#1a1020);color:#c0a8c0;border-radius:0 0 3px 3px;box-shadow:0 2px 0 #100810;pointer-events:auto;z-index:2;font-size:.48rem;display:flex;align-items:flex-end;justify-content:center;padding-bottom:4px}
.black.active{background:linear-gradient(180deg,#8a50a0,#5a3080);transform:translateY(1px)}
.side{grid-column:2;grid-row:3;background:#1c1024;border-left:1px solid #3a2848;display:flex;flex-direction:column;overflow:hidden;min-height:0}
.side-h{padding:3px 5px;font-size:.62rem;color:#b090b0;border-bottom:1px solid #3a2848;display:flex;justify-content:space-between}
.tracks-list{flex:1;overflow-y:auto;padding:3px}
.track{background:#241830;border:1px solid #4a3050;border-radius:4px;padding:3px 4px;margin-bottom:2px;font-size:.55rem}
.track.muted{opacity:.4}
.track-row{display:flex;align-items:center;gap:2px}
.track-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#d0b0d0}
.track button{padding:1px 3px;font-size:.5rem;min-width:18px}
.track-vol{width:42px;height:8px}
.side-act{padding:3px;display:flex;flex-direction:column;gap:3px;border-top:1px solid #3a2848}
.side-act-row{display:flex;gap:2px;align-items:center}
.side-act button{flex:1;min-width:48px;font-size:.55rem;padding:3px 2px}
.input-with-btn {
  display: flex;
  align-items: center;
  background: #2a1834;
  border: 1px solid #5a3a60;
  border-radius: 5px;
  overflow: hidden;
  flex: 1.6;
}
.input-with-btn input[type=text] {
  border: none;
  background: transparent;
  width: 100%;
  padding: 3px 4px;
  font-size: .55rem;
  color: #f0e0f0;
  outline: none;
}
.input-with-btn button {
  border: none;
  border-left: 1px solid #5a3a60;
  border-radius: 0;
  background: #382042;
  padding: 3px 5px;
  font-size: .55rem;
  color: #f0e0f0;
  cursor: pointer;
}
.input-with-btn button:active {
  background: #7a4090;
}
.drums-row{grid-column:1/-1;display:grid;grid-template-columns:repeat(8,1fr);gap:3px;padding:3px 5px;background:#1c1024;border-top:1px solid #3a2848}
.drum{background:linear-gradient(180deg,#3a2848,#241830);border:1.5px solid #5a3a60;border-radius:6px;padding:5px 1px;text-align:center;font-size:.55rem;font-weight:600;color:#c0a0c0;cursor:pointer;min-height:32px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.drum:active,.drum.hit{background:linear-gradient(180deg,#a060b0,#703090);border-color:#e0b0e0;color:#fff;transform:scale(.95)}
.loops-row{grid-column:1/-1;display:flex;flex-wrap:nowrap;gap:3px;padding:3px 5px 5px;background:#160a18;border-top:1px solid #3a2848;overflow-x:auto;scrollbar-width:none}
.loops-row::-webkit-scrollbar{display:none}
.loop-btn{flex-shrink:0;background:#2a1834;border:1.5px solid #5a3a60;border-radius:6px;padding:4px 7px;font-size:.55rem;color:#c0a0c0;cursor:pointer;white-space:nowrap}
.loop-btn.on{background:#7a4090;border-color:#d0a0e0;color:#fff}
.loop-btn:active{transform:scale(.96)}
footer{grid-column:1/-1;padding:2px 8px;font-size:.5rem;color:#705870;display:flex;justify-content:space-between;background:#100810}
.rotate-hint{display:none;position:fixed;inset:0;background:#160a18;z-index:999;flex-direction:column;align-items:center;justify-content:center;gap:10px;font-size:1rem;color:#d0a0c8}
@media (orientation:portrait) and (max-width:600px){.rotate-hint{display:flex}.app{display:none}}
</style>
</head>
<body>
<div class="rotate-hint"><div style="font-size:2rem">🔄</div><div>Поверни в альбомный режим</div></div>
<div class="app">
  <div class="topbar">
    <h1>🎹 Synth Studio</h1>
    <div class="controls">
      <label>Тембр<select id="timbre">
        <option value="triangle">Triangle</option><option value="sine">Sine</option>
        <option value="sawtooth">Saw</option><option value="square">Square</option>
        <option value="fm">FM</option><option value="organ">Organ</option>
        <option value="pluck">Pluck</option><option value="pad">Pad</option>
        <option value="bass">Bass</option>
      </select></label>
      <label>Окт<select id="baseOctave">
        <option value="2">C2–C4</option><option value="3" selected>C3–C5</option><option value="4">C4–C6</option>
      </select></label>
      <button id="micBtn">🎙 Mic</button>
      <button id="sustainBtn">Sus</button>
      <button id="arpBtn">Arp</button>
      <label>Arp<select id="arpPattern">
        <option value="up">↑</option><option value="down">↓</option>
        <option value="updown">↕</option><option value="random">🎲</option><option value="chord">▣</option>
      </select></label>
      <label>Takts<select id="arpBars">
        <option value="3">3 T</option>
        <option value="4" selected>4 T</option>
      </select></label>
      <label>Rate <input type="number" id="arpRate" min="40" max="500" value="150" step="1"></label>
      <button id="midiBtn">MIDI</button>
      <span class="status" id="status">Ready</span>
    </div>
  </div>
  <div class="fxbar">
    <div class="fx-group"><span>Vol</span><input type="range" id="masterVol" min="0" max="150" value="110"></div>
    <div class="fx-group"><span>Filter</span><input type="range" id="filterFreq" min="200" max="8000" value="5000"><input type="range" id="filterQ" min="0" max="20" value="2"></div>
    <div class="fx-group"><span>Delay</span><input type="range" id="delayMix" min="0" max="100" value="15"><input type="range" id="delayTime" min="50" max="600" value="250"></div>
    <div class="fx-group"><span>Drive</span><input type="range" id="driveAmount" min="0" max="100" value="0"></div>
    <div class="fx-group"><span>Reverb</span><input type="range" id="reverbMix" min="0" max="100" value="20"></div>
  </div>
  <div class="kb-wrap">
    <div class="oct-lab" id="octaveLabels"></div>
    <div class="keys" id="keyboard"></div>
  </div>
  <div class="side">
    <div class="side-h"><span>Дорожки</span><span id="trackCount">0</span></div>
    <div class="tracks-list" id="tracksList"></div>
    <div class="side-act">
      <div class="side-act-row">
        <button id="recTrackBtn">● Запись</button>
        <button id="playAllBtn">▶</button>
        <button id="stopAllBtn">■</button>
        <button id="clearTracksBtn">🗑</button>
      </div>
      <div class="side-act-row">
        <div class="input-with-btn">
          <input type="text" id="exportName" value="mix" placeholder="Имя">
          <button id="exportBtn" title="Сохранить">💾</button>
        </div>
        <select id="exportFormat" style="flex:0.7; font-size:.55rem;"><option value="wav">WAV</option><option value="mp3">MP3</option></select>
      </div>
    </div>
  </div>
  <div class="drums-row" id="drums"></div>
  <div class="loops-row" id="loops"></div>
  <footer><span>Чистая запись · WYSIWYG · Персональные эффекты дорожек</span><span id="midiInfo">MIDI: —</span></footer>
</div>
<script>
(function(){
const NOTE_NAMES=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const WHITE_NOTES=[0,2,4,5,7,9,11];
const DRUM_DEFS=[
  {id:'kick',n:'Kick'},{id:'snare',n:'Snare'},{id:'hat',n:'Hat'},{id:'ohat',n:'OHat'},
  {id:'clap',n:'Clap'},{id:'tom',n:'Tom'},{id:'rim',n:'Rim'},{id:'perc',n:'Perc'}
];
const LOOP_STYLES=[
  {name:'House',bpm:124,bars:1,pat:{K:'x...x...x...x...',S:'....x.......x...',H:'x.x.x.x.x.x.x.x.'}},
  {name:'Techno',bpm:130,bars:1,pat:{K:'x...x...x...x...',S:'....x.......x...',H:'xxxxxxxxxxxxxxxx'}},
  {name:'Hip-Hop',bpm:90,bars:1,pat:{K:'x.....x.x.......',S:'....x.......x...',H:'..x...x...x...x.'}},
  {name:'Trap',bpm:140,bars:1,pat:{K:'x.....x.........',S:'....x..x....x..x',H:'x.x.x.xxx.x.x.xx'}},
  {name:'Rock',bpm:110,bars:1,pat:{K:'x...x...x...x...',S:'....x.......x...',H:'x.x.x.x.x.x.x.x.'}},
  {name:'Funk',bpm:100,bars:1,pat:{K:'x.....x...x.....',S:'....x......xx...',H:'x.x.x.x.x.x.x.x.'}},
  {name:'DnB',bpm:174,bars:1,pat:{K:'x.....x.x...x...',S:'....x.......x...',H:'xxxxxxxxxxxxxxxx'}},
  {name:'Garage',bpm:130,bars:1,pat:{K:'x...x..x.x......',S:'....x.......x...',H:'x.x.x.x.x.x.x.x.'}},
  {name:'Latin',bpm:100,bars:1,pat:{K:'x...x...x.x.x...',S:'....x...x...x...',H:'..x...x...x...x.',R:'x.x.x.x.x.x.x.x.'}},
  {name:'Reggaeton',bpm:95,bars:1,pat:{K:'x...x...x...x...',S:'....x.x.....x.x.',H:'................',C:'....x.x.....x.x.'}},
  {name:'Breakbeat',bpm:135,bars:1,pat:{K:'x.....x...x.....',S:'....x...x..xx...',H:'x.x.x.x.x.x.x.x.'}},
  {name:'Ambient',bpm:80,bars:2,pat:{K:'x...............',S:'........x.......',H:'....x.......x...',P:'..x...........x.'}},
  {name:'Jazz',bpm:120,bars:1,pat:{K:'x.......x...x...',S:'....x.......x...',H:'x.x.x.x.x.x.x.x.',R:'..............x.'}},
  {name:'Dubstep',bpm:140,bars:1,pat:{K:'x.......x.......',S:'....x.......x...',H:'x...x...x...x...',O:'..............x.'}},
  {name:'Afrobeat',bpm:110,bars:1,pat:{K:'x...x.x.x...x.x.',S:'....x.......x...',H:'x.x.x.x.x.x.x.x.',T:'..x...........x.'}},
  {name:'BoomBap',bpm:88,bars:1,pat:{K:'x......x.x......',S:'....x.......x...',H:'..x...x...x...x.'}},
  {name:'Trance',bpm:138,bars:1,pat:{K:'x...x...x...x...',S:'....x.......x...',H:'x.x.x.x.x.x.x.x.',O:'..............xx'}},
  {name:'Lo-Fi',bpm:85,bars:1,pat:{K:'x.....x.x.......',S:'....x.......x...',H:'..x...x...x...x.',P:'........x.......'}},
];

let audioCtx,masterGain,filterNode,delayNode,delayFb,delayWet,dryGain,driveNode,reverbWet;
let recordDest,recBus,micStream,micSource,micGain,micEnabled=false,drumGain;
let speechOn=false,sustain=false,arpOn=false,arpPattern='up',arpRateMs=150,arpBars=4,arpTimer=null;
let arpHeld=[],arpIndex=0,arpDir=1,arpStepCounter=0;
let activeNotes=new Map(),baseOctave=3,timbre='triangle';
let tracks=[],nextId=1,isRec=false,playSrcs=[];
let recChunksL=[],recChunksR=[],recProcessor=null,recSilent=null,recSampleCount=0;
let loopPlayers={};
let midiAccess=null;

const statusEl=document.getElementById('status');
const tracksList=document.getElementById('tracksList');
const trackCountEl=document.getElementById('trackCount');
const keyboard=document.getElementById('keyboard');

function ensureAudio(){
  if(audioCtx){if(audioCtx.state==='suspended')audioCtx.resume();return;}
  audioCtx=new(window.AudioContext||window.webkitAudioContext)();
  masterGain=audioCtx.createGain();masterGain.gain.value=1.1;masterGain.connect(audioCtx.destination);
  
  filterNode=audioCtx.createBiquadFilter();filterNode.type='lowpass';filterNode.frequency.value=5000;filterNode.Q.value=2;
  
  driveNode=audioCtx.createWaveShaper();
  updateDriveCurve(0);

  delayNode=audioCtx.createDelay(1);delayNode.delayTime.value=0.25;
  delayFb=audioCtx.createGain();delayFb.gain.value=0.3;
  delayWet=audioCtx.createGain();delayWet.gain.value=0.15;
  dryGain=audioCtx.createGain();dryGain.gain.value=0.85;

  reverbWet=audioCtx.createGain();reverbWet.gain.value=0.2;

  delayNode.connect(delayFb);delayFb.connect(delayNode);delayNode.connect(delayWet);
  
  filterNode.connect(driveNode);
  driveNode.connect(dryGain);
  dryGain.connect(masterGain);
  dryGain.connect(delayNode);
  delayWet.connect(masterGain);
  dryGain.connect(reverbWet);
  reverbWet.connect(masterGain);
  
  recBus=audioCtx.createGain();
  recBus.gain.value=1;
  recordDest=audioCtx.createMediaStreamDestination();
  recBus.connect(recordDest);
  drumGain=audioCtx.createGain();drumGain.gain.value=0.85;
  drumGain.connect(filterNode);
  drumGain.connect(recBus);
  micGain=audioCtx.createGain();micGain.gain.value=0;
  micGain.connect(filterNode); 
}

function updateDriveCurve(amount){
  if(!audioCtx||!driveNode)return;
  const k=typeof amount==='number'?amount:0;
  const n_samples=44100;
  const curve=new Float32Array(n_samples);
  const deg=Math.PI/180;
  for(let i=0;i<n_samples;++i){
    const x=(i*2)/n_samples-1;
    if(k===0){curve[i]=x;}else{curve[i]=((3+k)*x*20*deg)/(Math.PI+k*Math.abs(x));}
  }
  driveNode.curve=curve;
}

function liveOut(){
  const g=audioCtx.createGain();
  g.connect(filterNode);
  g.connect(recBus);
  return g;
}
function freqFromMidi(m){return 440*Math.pow(2,(m-69)/12);}
function noteLabel(m){return NOTE_NAMES[m%12]+(Math.floor(m/12)-1);}
function speak(t){
  if(!speechOn||!window.speechSynthesis)return;
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(t);u.lang='ru-RU';u.rate=1.2;u.volume=0.7;
  const v=speechSynthesis.getVoices().find(x=>x.lang.startsWith('ru'));if(v)u.voice=v;
  speechSynthesis.speak(u);
}

function createVoice(midi,now,customTimbre){
  const t = customTimbre || timbre;
  const freq=freqFromMidi(midi),gain=liveOut(),oscs=[],peak=0.22;
  let stopFn=null;
  if(['sine','triangle','sawtooth','square'].includes(t)){
    const o=audioCtx.createOscillator();o.type=t;o.frequency.value=freq;o.connect(gain);o.start(now);oscs.push(o);
    gain.gain.setValueAtTime(0.0001,now);gain.gain.exponentialRampToValueAtTime(peak,now+0.015);
    stopFn=dt=>{gain.gain.cancelScheduledValues(dt);gain.gain.setValueAtTime(Math.max(gain.gain.value,0.0001),dt);gain.gain.exponentialRampToValueAtTime(0.0001,dt+(sustain?1:0.18));o.stop(dt+(sustain?1.1:0.28));};
  } else if(t==='fm'){
    const car=audioCtx.createOscillator(),mod=audioCtx.createOscillator(),mg=audioCtx.createGain();
    car.type='sine';mod.type='sine';car.frequency.value=freq;mod.frequency.value=freq*3.5;mg.gain.value=freq*2;
    mod.connect(mg);mg.connect(car.frequency);car.connect(gain);car.start(now);mod.start(now);oscs.push(car,mod);
    gain.gain.setValueAtTime(0.0001,now);gain.gain.exponentialRampToValueAtTime(peak*0.8,now+0.006);gain.gain.exponentialRampToValueAtTime(0.0001,now+1.2);
    stopFn=dt=>{car.stop(dt+0.04);mod.stop(dt+0.04);};
  } else if(t==='organ'){
    [1,2,3,4].forEach((m,i)=>{const o=audioCtx.createOscillator();o.type='sine';o.frequency.value=freq*m;const g=audioCtx.createGain();g.gain.value=[0.35,0.22,0.12,0.08][i];o.connect(g);g.connect(gain);o.start(now);oscs.push(o);});
    gain.gain.setValueAtTime(0.0001,now);gain.gain.exponentialRampToValueAtTime(peak*0.6,now+0.03);
    stopFn=dt=>{gain.gain.cancelScheduledValues(dt);gain.gain.setValueAtTime(Math.max(gain.gain.value,0.0001),dt);gain.gain.exponentialRampToValueAtTime(0.0001,dt+(sustain?0.7:0.2));oscs.forEach(o=>o.stop(dt+(sustain?0.8:0.3)));};
  } else if(t==='pluck'){
    const o=audioCtx.createOscillator();o.type='sawtooth';o.frequency.value=freq;
    const f=audioCtx.createBiquadFilter();f.type='lowpass';f.frequency.setValueAtTime(freq*8,now);f.frequency.exponentialRampToValueAtTime(freq*1.4,now+0.25);f.Q.value=2;
    o.connect(f);f.connect(gain);o.start(now);oscs.push(o);
    gain.gain.setValueAtTime(0.0001,now);gain.gain.exponentialRampToValueAtTime(peak,now+0.004);gain.gain.exponentialRampToValueAtTime(0.0001,now+0.5);
    stopFn=dt=>o.stop(dt+0.04);
  } else if(t==='pad'){
    [0,0.04,-0.03].forEach(d=>{const o=audioCtx.createOscillator();o.type='sawtooth';o.frequency.value=freq;o.detune.value=d*100;const f=audioCtx.createBiquadFilter();f.type='lowpass';f.frequency.value=1400;o.connect(f);f.connect(gain);o.start(now);oscs.push(o);});
    gain.gain.setValueAtTime(0.0001,now);gain.gain.linearRampToValueAtTime(peak*0.35,now+0.35);
    stopFn=dt=>{gain.gain.cancelScheduledValues(dt);gain.gain.setValueAtTime(Math.max(gain.gain.value,0.0001),dt);gain.gain.linearRampToValueAtTime(0.0001,dt+(sustain?1.5:0.6));oscs.forEach(o=>o.stop(dt+(sustain?1.6:0.7)));};
  } else if(t==='bass'){
    const o=audioCtx.createOscillator();o.type='sawtooth';o.frequency.value=freq;
    const f=audioCtx.createBiquadFilter();f.type='lowpass';f.frequency.setValueAtTime(freq*5,now);f.frequency.exponentialRampToValueAtTime(freq*1.2,now+0.1);f.Q.value=4;
    o.connect(f);f.connect(gain);o.start(now);oscs.push(o);
    gain.gain.setValueAtTime(0.0001,now);gain.gain.exponentialRampToValueAtTime(peak,now+0.008);
    stopFn=dt=>{gain.gain.cancelScheduledValues(dt);gain.gain.setValueAtTime(Math.max(gain.gain.value,0.0001),dt);gain.gain.exponentialRampToValueAtTime(0.0001,dt+(sustain?0.5:0.15));o.stop(dt+(sustain?0.6:0.22));};
  }
  return {oscs,gain,stopFn};
}

function playNote(midi,keyEl){
  ensureAudio();if(activeNotes.has(midi))return;
  if(arpOn){
    if(!arpHeld.includes(midi)){arpHeld.push(midi);arpHeld.sort((a,b)=>a-b);}
    if(keyEl)keyEl.classList.add('active');statusEl.textContent=noteLabel(midi);
    if(!arpTimer)startArp();return;
  }
  const now=audioCtx.currentTime,v=createVoice(midi,now);
  activeNotes.set(midi,{...v,keyEl});if(keyEl)keyEl.classList.add('active');

function arpStep(){
  if(!arpOn||!arpHeld.length){stopArp();return;}
  const maxSteps = arpBars * 4;
  if(arpStepCounter >= maxSteps){
    stopArp();
    arpOn = false;
    document.getElementById('arpBtn').classList.remove('on');
    statusEl.textContent = 'Arp End';
    return;
  }
  arpStepCounter++;

  ensureAudio();const now=audioCtx.currentTime;
  for(const m of[...activeNotes.keys()]){const e=activeNotes.get(m);if(e?.stopFn)e.stopFn(now);}activeNotes.clear();
  let notes=[];if(arpPattern==='chord')notes=[...arpHeld];
  else{let idx;if(arpPattern==='up'){idx=arpIndex%arpHeld.length;arpIndex++;}
    else if(arpPattern==='down'){idx=arpHeld.length-1-(arpIndex%arpHeld.length);arpIndex++;}
    else if(arpPattern==='updown'){if(arpHeld.length===1)idx=0;else{idx=arpIndex;arpIndex+=arpDir;if(arpIndex>=arpHeld.length-1)arpDir=-1;if(arpIndex<=0)arpDir=1;}}
    else idx=Math.floor(Math.random()*arpHeld.length);notes=[arpHeld[idx]];}
  notes.forEach(midi=>{const v=createVoice(midi,now);const gate=Math.min(arpRateMs/1000*0.8,0.3);
    v.gain.gain.cancelScheduledValues(now);v.gain.gain.setValueAtTime(0.0001,now);v.gain.gain.exponentialRampToValueAtTime(0.2,now+0.008);v.gain.gain.exponentialRampToValueAtTime(0.0001,now+gate);
    activeNotes.set(midi,v);statusEl.textContent=noteLabel(midi);});
  arpTimer=setTimeout(arpStep,arpRateMs);
}

function generateLoopBuffer(style){
  ensureAudio();
  const sr=audioCtx.sampleRate;
  const stepDur = 60 / style.bpm / 4;
  const totalDur = stepDur * 16 * style.bars;
  const len = Math.floor(totalDur * sr);
  const buf = audioCtx.createBuffer(1, len, sr);
  const data = buf.getChannelData(0);
  const map={K:'kick',S:'snare',H:'hat',O:'ohat',C:'clap',T:'tom',R:'rim',P:'perc'};
  function hit(type,atSec,vel){
    const at=Math.floor(atSec*sr);
    if(type==='kick'){for(let i=0;i<Math.min(sr*0.35,len-at);i++){const t=i/sr;const env=Math.exp(-t*8);const f=150*Math.exp(-t*20)+40;data[at+i]+=vel*env*Math.sin(2*Math.PI*f*t)*0.9;}}
    else if(type==='snare'){for(let i=0;i<Math.min(sr*0.18,len-at);i++){const t=i/sr;const env=Math.exp(-t*12);data[at+i]+=vel*env*((Math.random()*2-1)*0.5+Math.sin(2*Math.PI*180*t)*0.3);}}
    else if(type==='hat'){for(let i=0;i<Math.min(sr*0.05,len-at);i++){const t=i/sr;data[at+i]+=vel*Math.exp(-t*40)*(Math.random()*2-1)*0.25;}}
    else if(type==='ohat'){for(let i=0;i<Math.min(sr*0.3,len-at);i++){const t=i/sr;data[at+i]+=vel*Math.exp(-t*6)*(Math.random()*2-1)*0.22;}}
    else if(type==='clap'){for(let i=0;i<Math.min(sr*0.2,len-at);i++){const t=i/sr;data[at+i]+=vel*Math.exp(-t*10)*(Math.random()*2-1)*0.4;}}
    else if(type==='tom'){for(let i=0;i<Math.min(sr*0.28,len-at);i++){const t=i/sr;const f=200*Math.exp(-t*8)+70;data[at+i]+=vel*Math.exp(-t*7)*Math.sin(2*Math.PI*f*t)*0.6;}}
    else if(type==='rim'){for(let i=0;i<Math.min(sr*0.04,len-at);i++){const t=i/sr;data[at+i]+=vel*Math.exp(-t*50)*Math.sin(2*Math.PI*800*t)*0.35;}}
    else if(type==='perc'){for(let i=0;i<Math.min(sr*0.14,len-at);i++){const t=i/sr;const f=550*Math.exp(-t*10)+150;data[at+i]+=vel*Math.exp(-t*12)*Math.sin(2*Math.PI*f*t)*0.3;}}
  }
  Object.keys(style.pat).forEach(k=>{
    const pat=style.pat[k];const type=map[k];if(!type)return;
    for(let i=0;i<pat.length;i++){if(pat[i]==='x')hit(type,i*stepDur,0.85+Math.random()*0.15);}
  });
  for(let i=0;i<len;i++)data[i]=Math.max(-1,Math.min(1,data[i]));
  return buf;
}

function startSampleRec(){

    if(!isRec) return;
    const L=e.inputBuffer.getChannelData(0);
    const R=e.inputBuffer.getChannelData(1);
    recChunksL.push(new Float32Array(L));
    recChunksR.push(new Float32Array(R));
    recSampleCount+=L.length;
  };
  recBus.connect(recProcessor);
  recSilent=audioCtx.createGain();
  recSilent.gain.value=0;
  recProcessor.connect(recSilent);
  recSilent.connect(audioCtx.destination);
}
function stopSampleRec(){
  isRec=false;
  if(recProcessor){
    try{recBus.disconnect(recProcessor);}catch(e){}
    try{recProcessor.disconnect();}catch(e){}
    recProcessor.onaudioprocess=null;
    recProcessor=null;
  }
  if(recSilent){try{recSilent.disconnect();}catch(e){} recSilent=null;}
  if(recSampleCount<256){statusEl.textContent='Слишком коротко';return;}
  const sr=audioCtx.sampleRate;
  const buf=audioCtx.createBuffer(2, recSampleCount, sr);
  const oL=buf.getChannelData(0), oR=buf.getChannelData(1);
  let off=0;
  for(let i=0;i<recChunksL.length;i++){
    oL.set(recChunksL[i], off);
    oR.set(recChunksR[i], off);
    off+=recChunksL[i].length;
  }
  recChunksL=[]; recChunksR=[];
  let finalBuf=buf;
  if(tracks.length && tracks[0].buffer){
    const target=tracks[0].buffer.length;
    if(buf.length!==target){
      finalBuf=audioCtx.createBuffer(2, target, sr);
      const n=Math.min(buf.length, target);
      finalBuf.getChannelData(0).set(buf.getChannelData(0).subarray(0,n));
      finalBuf.getChannelData(1).set(buf.getChannelData(1).subarray(0,n));
    }
  }
  
  const currentFX = {
    timbre: timbre,
    filterFreq: +document.getElementById('filterFreq').value,
    filterQ: +document.getElementById('filterQ').value,
    delayMix: +document.getElementById('delayMix').value,
    delayTime: +document.getElementById('delayTime').value,
    driveAmount: +document.getElementById('driveAmount').value,
    reverbMix: +document.getElementById('reverbMix').value
  };

  addTrack(finalBuf, micEnabled?'Live+Mic':'Live', currentFX);

}

function playAllTracks(silent){
  ensureAudio();stopPlayAll();
  if(!tracks.length&&!silent){statusEl.textContent='Нет дорожек';return;}
  const now=silent ? audioCtx.currentTime : audioCtx.currentTime+0.03;
  tracks.forEach(t=>{
    if(t.muted||!t.buffer)return;
    const src=audioCtx.createBufferSource();src.buffer=t.buffer;
    
    const trackFilter=audioCtx.createBiquadFilter();
    trackFilter.type='lowpass';
    trackFilter.frequency.value=t.fx.filterFreq;
    trackFilter.Q.value=t.fx.filterQ/2;

    const trackDrive=audioCtx.createWaveShaper();
    const k=t.fx.driveAmount||0;
    const n_samples=44100;const curve=new Float32Array(n_samples);const deg=Math.PI/180;
    for(let i=0;i<n_samples;++i){const x=(i*2)/n_samples-1;curve[i]=k===0?x:((3+k)*x*20*deg)/(Math.PI+k*Math.abs(x));}
    trackDrive.curve=curve;

    const trackDelay=audioCtx.createDelay(1);
    trackDelay.delayTime.value=t.fx.delayTime/1000;
    const trackDelayFb=audioCtx.createGain();trackDelayFb.gain.value=0.3;
    const trackDelayWet=audioCtx.createGain();trackDelayWet.gain.value=t.fx.delayMix/100;
    const trackDryGain=audioCtx.createGain();trackDryGain.gain.value=0.85;
    const trackReverbWet=audioCtx.createGain();trackReverbWet.gain.value=(t.fx.reverbMix||20)/100;

    trackDelay.connect(trackDelayFb);trackDelayFb.connect(trackDelay);trackDelay.connect(trackDelayWet);
    trackFilter.connect(trackDrive);
    trackDrive.connect(trackDryGain);

    const g=audioCtx.createGain();g.gain.value=t.gainValue;
    
    trackDryGain.connect(g);
    trackDelayWet.connect(g);
    trackDryGain.connect(trackReverbWet);
    trackReverbWet.connect(g);
    trackDryGain.connect(trackDelay);

    src.connect(trackFilter);
    g.connect(masterGain);
    
    src.start(now);
    playSrcs.push({src:src, gain:g, id:t.id});
  });
  if(!silent){statusEl.textContent='▶ Playing';document.getElementById('playAllBtn').classList.add('on');}
}

async function renderMixBuffer(){
  const maxDur=Math.max(...tracks.filter(t=>t.buffer).map(t=>t.buffer.duration),0.1);
  const off=new OfflineAudioContext(2,Math.ceil(maxDur*audioCtx.sampleRate),audioCtx.sampleRate);
  tracks.forEach(t=>{
    if(!t.buffer||t.muted)return;
    const s=off.createBufferSource();s.buffer=t.buffer;
    
    const offFilter=off.createBiquadFilter();
    offFilter.type='lowpass';offFilter.frequency.value=t.fx.filterFreq;offFilter.Q.value=t.fx.filterQ/2;
    
    const offDrive=off.createWaveShaper();
    const k=t.fx.driveAmount||0;const n_samples=44100;const curve=new Float32Array(n_samples);const deg=Math.PI/180;
    for(let i=0;i<n_samples;++i){const x=(i*2)/n_samples-1;curve[i]=k===0?x:((3+k)*x*20*deg)/(Math.PI+k*Math.abs(x));}
    offDrive.curve=curve;

    const offDelay=off.createDelay(1);offDelay.delayTime.value=t.fx.delayTime/1000;
    const offDelayFb=off.createGain();offDelayFb.gain.value=0.3;
    const offDelayWet=off.createGain();offDelayWet.gain.value=t.fx.delayMix/100;
    const offDry=off.createGain();offDry.gain.value=0.85;
    const offReverbWet=off.createGain();offReverbWet.gain.value=(t.fx.reverbMix||20)/100;
    
    offDelay.connect(offDelayFb);offDelayFb.connect(offDelay);offDelay.connect(offDelayWet);
    offFilter.connect(offDrive);
    offDrive.connect(offDry);
    
    const g=off.createGain();g.gain.value=t.gainValue;
    offDry.connect(g);offDelayWet.connect(g);offDry.connect(offReverbWet);offReverbWet.connect(g);offDry.connect(offDelay);
    
    s.connect(offFilter);g.connect(off.destination);s.start(0);
  });
  return await off.startRendering();
}

function bufferToMp3(buffer) {
  const channels = buffer.numberOfChannels;
  const sampleRate = buffer.sampleRate;
  const samples = buffer.length;
  
  const mp3encoder = new lamejs.Mp3Encoder(channels, sampleRate, 128);
  const mp3Data = [];
  
  const sampleBlockSize = 1152;
  const left = buffer.getChannelData(0);
  const right = channels > 1 ? buffer.getChannelData(1) : left;
  
  const leftInt16 = new Int16Array(samples);
  const rightInt16 = new Int16Array(samples);
  
  for (let i = 0; i < samples; i++) {
    leftInt16[i] = Math.max(-32768, Math.min(32767, left[i] * 32768));
    rightInt16[i] = Math.max(-32768, Math.min(32767, right[i] * 32768));
  }
  
  for (let i = 0; i < samples; i += sampleBlockSize) {
    const chunkLeft = leftInt16.subarray(i, i + sampleBlockSize);
    const chunkRight = rightInt16.subarray(i, i + sampleBlockSize);
    const mp3buf = mp3encoder.encodeBuffer(chunkLeft, chunkRight);
    if (mp3buf.length > 0) {
      mp3Data.push(new Int8Array(mp3buf));
    }
  }
  
  const mp3buf = mp3encoder.flush();
  if (mp3buf.length > 0) {
    mp3Data.push(new Int8Array(mp3buf));
  }
  
  return new Blob(mp3Data, { type: 'audio/mp3' });
}

function bufToWav(buffer){
  const nCh=buffer.numberOfChannels,sr=buffer.sampleRate,ab=new ArrayBuffer(44+buffer.length*nCh*2),v=new DataView(ab);
  const ws=(o,s)=>{for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i));};
  ws(0,'RIFF');v.setUint32(4,36+buffer.length*nCh*2,true);ws(8,'WAVE');ws(12,'fmt ');
  v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,nCh,true);v.setUint32(24,sr,true);
  v.setUint32(28,sr*nCh*2,true);v.setUint16(32,nCh*2,true);v.setUint16(34,16,true);ws(36,'data');v.setUint32(40,buffer.length*nCh*2,true);
  let o=44;for(let i=0;i<buffer.length;i++)for(let c=0;c<nCh;c++){const s=Math.max(-1,Math.min(1,buffer.getChannelData(c)[i]));v.setInt16(o,s<0?s*0x8000:s*0x7FFF,true);o+=2;}
  return ab;
}

async function toggleMic(){
  ensureAudio();
  if(!micEnabled){
    if(!window.isSecureContext&&location.protocol!=='https:'&&location.hostname!=='localhost'&&location.hostname!=='127.0.0.1'){
      alert('Нужен localhost/https для микрофона');return;}
    try{
      micStream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}});
      micSource=audioCtx.createMediaStreamSource(micStream);
      micSource.connect(micGain);micGain.gain.value=0.9;
      micGain.connect(recBus);
      micEnabled=true;
      const mb=document.getElementById('micBtn');
      mb.classList.add('on'); mb.textContent='🎙 ON';
      statusEl.textContent='Mic ON';
    }catch(e){statusEl.textContent='Mic err';alert(e.name||e);}
  } else {
    micGain.gain.value=0;if(micStream)micStream.getTracks().forEach(t=>t.stop());
    micStream=null;micSource=null;micEnabled=false;
    const mb=document.getElementById('micBtn');
    mb.classList.remove('on'); mb.textContent='🎙 Mic';
    statusEl.textContent='Mic OFF';
  }
}

function buildKeyboard(){
  keyboard.innerHTML='';document.getElementById('octaveLabels').innerHTML='';
  const wDiv=document.createElement('div');wDiv.className='white-keys';
  const bDiv=document.createElement('div');bDiv.className='black-keys';
  const start=(baseOctave+1)*12,totalW=15;
  for(let o=0;o<2;o++){const s=document.createElement('span');s.textContent='О.'+(baseOctave+o);document.getElementById('octaveLabels').appendChild(s);}
  const last=document.createElement('span');last.textContent='C'+(baseOctave+2);document.getElementById('octaveLabels').appendChild(last);
  for(let i=0;i<totalW;i++){
    const oct=Math.floor(i/7),wi=i%7,isLast=i===totalW-1;
    const midi=isLast?start+24:start+oct*12+WHITE_NOTES[wi];
    const key=document.createElement('div');key.className='key white';key.dataset.midi=midi;key.textContent=noteLabel(midi);wDiv.appendChild(key);
    if(!isLast&&[0,1,3,4,5].includes(wi)){
      const bo={0:1,1:3,3:6,4:8,5:10}[wi];const bm=start+oct*12+bo;
      const black=document.createElement('div');black.className='key black';black.dataset.midi=bm;black.textContent=noteLabel(bm);
      const ww=100/totalW;black.style.left=((i+0.68)*ww-ww*0.55)+'%';black.style.width=(ww*1.15)+'%';bDiv.appendChild(black);
    }
  }
  keyboard.appendChild(wDiv);keyboard.appendChild(bDiv);

  const fingerNotes = new Map();

  function keyFromPoint(x, y){
    const stack = document.elementsFromPoint(x, y);
    for (let i = 0; i < stack.length; i++) {
      const el = stack[i];
      if (el.classList && el.classList.contains('key') && el.dataset.midi) return el;
    }
    return null;
  }

  function fingerDown(id, x, y){
    const key = keyFromPoint(x, y);
    if (!key) return;
    const midi = +key.dataset.midi;
    if (fingerNotes.has(id)) {
      const prev = fingerNotes.get(id);
      if (prev !== midi && !sustain) stopNote(prev);
    }
    fingerNotes.set(id, midi);
    playNote(midi, key);
  }

  function fingerMove(id, x, y){
    if (!fingerNotes.has(id)) return;
    const prev = fingerNotes.get(id);
    const key = keyFromPoint(x, y);
    if (!key) return;
    const midi = +key.dataset.midi;
    if (midi === prev) return;
    if (!sustain) stopNote(prev);
    fingerNotes.set(id, midi);
    playNote(midi, key);
  }

  function fingerUp(id){
    if (!fingerNotes.has(id)) return;
    const midi = fingerNotes.get(id);
    fingerNotes.delete(id);
    if (!sustain) stopNote(midi);
  }

  keyboard.addEventListener('touchstart', function(e){
    e.preventDefault();
    ensureAudio();
    for (let i = 0; i < e.changedTouches.length; i++) {
      const t = e.changedTouches[i];
      fingerDown('t' + t.identifier, t.clientX, t.clientY);
    }
  }, { passive: false });

  keyboard.addEventListener('touchmove', function(e){
    e.preventDefault();
    for (let i = 0; i < e.changedTouches.length; i++) {
      const t = e.changedTouches[i];
      fingerMove('t' + t.identifier, t.clientX, t.clientY);
    }
  }, { passive: false });

  keyboard.addEventListener('touchend', function(e){
    e.preventDefault();
    for (let i = 0; i < e.changedTouches.length; i++) {
      fingerUp('t' + e.changedTouches[i].identifier);
    }
  }, { passive: false });

  keyboard.addEventListener('touchcancel', function(e){
    for (let i = 0; i < e.changedTouches.length; i++) {
      fingerUp('t' + e.changedTouches[i].identifier);
    }
  }, { passive: false });

  keyboard.addEventListener('pointerdown', function(e){
    if (e.pointerType === 'touch') return;
    if (e.button !== 0) return;
    e.preventDefault();
    ensureAudio();
    try { keyboard.setPointerCapture(e.pointerId); } catch (err) {}
    fingerDown('p' + e.pointerId, e.clientX, e.clientY);
  });
  keyboard.addEventListener('pointermove', function(e){
    if (e.pointerType === 'touch') return;
    if (!fingerNotes.has('p' + e.pointerId)) return;
    fingerMove('p' + e.pointerId, e.clientX, e.clientY);
  });
  keyboard.addEventListener('pointerup', function(e){
    if (e.pointerType === 'touch') return;
    fingerUp('p' + e.pointerId);
  });
  keyboard.addEventListener('pointercancel', function(e){
    if (e.pointerType === 'touch') return;
    fingerUp('p' + e.pointerId);
  });
}

function onMIDI(ev){
  ensureAudio();
  const d=ev.data; if(!d||d.length<2) return;
  const st=d[0], note=d[1], vel=d.length>2?d[2]:0;
  const cmd=st&0xf0;
  if(cmd===0x90 && vel>0){
    const keyEl=document.querySelector('.key[data-midi="'+note+'"]');
    playNote(note, keyEl);
  } else if(cmd===0x80 || (cmd===0x90 && vel===0)){
    stopNote(note);
  } else if(cmd===0xB0 && note===64){
    sustain = vel>=64;
    document.getElementById('sustainBtn').classList.toggle('on', sustain);
  }
}
function hookMidiInputs(){
  if(!midiAccess) return;
  const names=[];
  midiAccess.inputs.forEach(input=>{
    input.onmidimessage = onMIDI;
    names.push(input.name||'MIDI');
  });
  const info=document.getElementById('midiInfo');
  const btn=document.getElementById('midiBtn');
  if(names.length){
    info.textContent='MIDI: '+names.join(', ');
    btn.classList.add('on');
    statusEl.textContent='MIDI OK';
  } else {
    info.textContent='MIDI: ждём клавиатуру…';
    btn.classList.remove('on');
  }
}
async function initMIDI(){
  if(!navigator.requestMIDIAccess){
    document.getElementById('midiInfo').textContent='MIDI: не поддерживается';
    alert('Web MIDI не поддерживается в этом браузере.');
    return;
  }
  try{
    midiAccess = await navigator.requestMIDIAccess({ sysex: false });
    hookMidiInputs();
    midiAccess.onstatechange = function(e){
      hookMidiInputs();
      const p=e.port;
      if(p && p.type==='input'){
        statusEl.textContent = (p.state==='connected' ? 'MIDI + ' : 'MIDI − ') + (p.name||'');
      }
    };
  } catch(err){
    document.getElementById('midiInfo').textContent='MIDI: нет доступа';
  }
}

document.getElementById('sustainBtn').addEventListener('click',function(){sustain=!sustain;this.classList.toggle('on',sustain);if(!sustain&&!arpOn)stopAllNotes();});
document.getElementById('arpBtn').addEventListener('click',function(){arpOn=!arpOn;this.classList.toggle('on',arpOn);if(!arpOn){stopArp();arpHeld=[];document.querySelectorAll('.key.active').forEach(k=>k.classList.remove('active'));}});
document.getElementById('arpPattern').addEventListener('change',e=>arpPattern=e.target.value);
document.getElementById('arpBars').addEventListener('change',e=>arpBars=+e.target.value);

const arpRateInput = document.getElementById('arpRate');
arpRateInput.addEventListener('input', e => {
  const val = parseInt(e.target.value);
  if (!isNaN(val) && val >= 40 && val <= 500) {
    arpRateMs = val;
  }
});

document.getElementById('micBtn').addEventListener('click',toggleMic);
document.getElementById('midiBtn').addEventListener('click',()=>{
  ensureAudio();
  if(!midiAccess) initMIDI();
  else hookMidiInputs();
});
document.getElementById('timbre').addEventListener('change',e=>timbre=e.target.value);
document.getElementById('baseOctave').addEventListener('change',e=>{baseOctave=+e.target.value;stopAllNotes();buildKeyboard();});
document.getElementById('masterVol').addEventListener('input',e=>{if(masterGain)masterGain.gain.setTargetAtTime(e.target.value/100,audioCtx.currentTime,0.02);});
document.getElementById('filterFreq').addEventListener('input',e=>{if(filterNode)filterNode.frequency.setTargetAtTime(+e.target.value,audioCtx.currentTime,0.02);});
document.getElementById('filterQ').addEventListener('input',e=>{if(filterNode)filterNode.Q.setTargetAtTime(+e.target.value/2,audioCtx.currentTime,0.02);});
document.getElementById('delayMix').addEventListener('input',e=>{if(delayWet)delayWet.gain.setTargetAtTime(e.target.value/100,audioCtx.currentTime,0.02);});
document.getElementById('delayTime').addEventListener('input',e=>{if(delayNode)delayNode.delayTime.setTargetAtTime(e.target.value/1000,audioCtx.currentTime,0.02);});
document.getElementById('driveAmount').addEventListener('input',e=>{updateDriveCurve(+e.target.value);});
document.getElementById('reverbMix').addEventListener('input',e=>{if(reverbWet)reverbWet.gain.setTargetAtTime(+e.target.value/100,audioCtx.currentTime,0.02);});

document.getElementById('recTrackBtn').addEventListener('click',toggleTrackRec);
document.getElementById('playAllBtn').addEventListener('click',()=>playAllTracks(false));
document.getElementById('stopAllBtn').addEventListener('click',()=>{stopPlayAll();stopAllNotes();stopAllLoops();});
document.getElementById('exportBtn').addEventListener('click',exportMix);
document.getElementById('clearTracksBtn').addEventListener('click',()=>{stopPlayAll();tracks=[];renderTracks();statusEl.textContent='Очищено';});

buildKeyboard();buildDrums();buildLoops();
document.body.addEventListener('pointerdown',()=>{ensureAudio();if(!midiAccess&&navigator.requestMIDIAccess)initMIDI();},{once:true});
if(window.speechSynthesis){speechSynthesis.getVoices();speechSynthesis.onvoiceschanged=()=>speechSynthesis.getVoices();}
})();
</script>
